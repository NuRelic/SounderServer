<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        header {
            background: #1a1a2e;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #555;
            display: inline-block;
        }
        .status-dot.connected { background: #4ecca3; }
        .status-dot.playing { background: #e94560; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; } }

        /* Tab bar for main sections */
        .section-tabs {
            display: flex;
            background: #16213e;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .section-tabs button {
            flex: 0 0 auto;
            padding: 10px 18px;
            border: none;
            background: transparent;
            color: #8a8a8a;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
        }
        .section-tabs button.active {
            color: #e94560;
            border-bottom-color: #e94560;
        }

        /* Content panels */
        .panel { display: none; padding: 12px; }
        .panel.active { display: block; }

        /* Group tabs within sound 1 */
        .group-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 12px;
        }
        .group-tabs button {
            padding: 6px 12px;
            border: 1px solid #333;
            border-radius: 16px;
            background: #1a1a2e;
            color: #aaa;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .group-tabs button.active {
            background: #e94560;
            color: white;
            border-color: #e94560;
        }

        /* Song buttons */
        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }
        .song-btn {
            padding: 12px 8px;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #16213e;
            color: #e0e0e0;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
            word-wrap: break-word;
        }
        .song-btn:active, .song-btn.playing {
            background: #e94560;
            border-color: #e94560;
            transform: scale(0.95);
        }
        .song-btn .song-num {
            font-size: 0.65rem;
            color: #666;
            display: block;
            margin-bottom: 2px;
        }

        /* Slots 2-7 buttons */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
        }
        .slot-btn {
            padding: 24px 12px;
            border: 2px solid #2a2a3e;
            border-radius: 12px;
            background: #16213e;
            color: #e0e0e0;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .slot-btn:active {
            background: #e94560;
            border-color: #e94560;
            transform: scale(0.95);
        }

        /* DCC category tabs */
        .dcc-cat-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .dcc-cat-tabs button {
            padding: 8px 14px;
            border: 1px solid #333;
            border-radius: 16px;
            background: #1a1a2e;
            color: #aaa;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .dcc-cat-tabs button.active {
            background: #0f3460;
            color: white;
            border-color: #0f3460;
        }

        .random-btn {
            width: 100%;
            padding: 16px;
            border: 2px dashed #e94560;
            border-radius: 12px;
            background: transparent;
            color: #e94560;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .random-btn:active { background: #e94560; color: white; }

        /* Add song form */
        .add-form {
            max-width: 500px;
            margin: 0 auto;
        }
        .add-form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #16213e;
            color: #e0e0e0;
            font-size: 0.9rem;
            margin-bottom: 8px;
            -webkit-appearance: none;
        }
        .add-form input, .add-form button {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #16213e;
            color: #e0e0e0;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .add-form button {
            background: #e94560;
            border-color: #e94560;
            cursor: pointer;
            font-weight: 600;
        }
        .add-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stop-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #c0392b;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Volume slider */
        #volumeSlider {
            height: 36px;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }
        #volumeSlider::-webkit-slider-runnable-track {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(to right, #333, #e94560);
        }
        #volumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e94560;
            border: 3px solid #fff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            margin-top: -12px;
        }
        #volumeSlider::-moz-range-track {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(to right, #333, #e94560);
        }
        #volumeSlider::-moz-range-thumb {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e94560;
            border: 3px solid #fff;
            cursor: pointer;
        }

        /* Loading */
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; gap:6px; flex:1; min-width:0;">
            <span class="status-dot" id="statusDot"></span>
            <div id="npTitleHeader" style="font-size:0.8rem; color:#e94560; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">Nothing playing</div>
            <span id="npTimeHeader" style="font-size:0.7rem; color:#666; flex-shrink:0;"></span>
        </div>
        <div style="display:flex; gap:4px; align-items:center; flex-shrink:0;">
            <span id="cc-transport" style="display:inline-flex; gap:4px;"><button id="pauseBtnHeader" onclick="togglePause()" style="background:#7f8c8d; border:none; color:white; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:0.9rem;">⏸</button>
            <button onclick="skipTrack()" style="background:#2980b9; border:none; color:white; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:0.9rem;">⏭</button>
            <button onclick="stopPlayback()" style="background:#c0392b; border:none; color:white; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:0.9rem;">⏹</button></span>
            <button onclick="location.href='/logout'" title="Log out" style="background:#444; border:none; color:white; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:0.9rem;">🚪</button>
        </div>
    </header>
    <div id="cc-presence" style="padding:9px 14px; background:#191933; font-size:0.95rem; color:#d7d7ee; display:flex; flex-direction:column; gap:5px; border-bottom:2px solid #7c3aed;">
        <span id="cc-online" style="font-weight:600;">👥 …</span>
        <span id="cc-active" style="color:#c4b5fd; font-weight:700;"></span>
    </div>
    <div id="cc-volbar" style="background:#1a1a2e; padding:4px 12px 8px; display:flex; align-items:center; gap:6px;">
        <button onclick="adjustVolume(-5)" style="background:#333; border:none; color:#e0e0e0; font-size:1.2rem; padding:4px 10px; border-radius:6px; cursor:pointer;">−</button>
        <input type="range" id="volumeSlider" min="0" max="100" value="100" step="1"
               oninput="setVolume(this.value)"
               style="flex:1; cursor:pointer; outline:none;">
        <button onclick="adjustVolume(5)" style="background:#333; border:none; color:#e0e0e0; font-size:1.2rem; padding:4px 10px; border-radius:6px; cursor:pointer;">+</button>
        <span id="volumeLabel" style="font-size:0.8rem; color:#aaa; min-width:35px; text-align:center; font-weight:600;">100%</span>
    </div>

    
    <!-- cc-audio-widget: Listen + search (one row on desktop, stacked on mobile) -->
    <div id="cc-toprow">
        <div id="cc-listen-bar" style="padding:8px 12px; background:#0f0f0f;">
            <button id="cc-stream-btn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;border:none;border-radius:12px;background:#6d28d9;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;animation:ccPulse 2.2s infinite;">
                <span id="cc-stream-ico">&#128266;</span><span id="cc-stream-label">Listen in this browser</span>
            </button>
        </div>
        <div id="cc-search-bar" style="padding:8px 12px; background:#0f0f0f;">
            <input type="text" id="globalSearch" placeholder="🔍 Search everything..."
                   oninput="doSearch(this.value)"
                   style="width:100%; padding:10px 14px; border:1px solid #333; border-radius:20px; background:#16213e; color:#e0e0e0; font-size:0.9rem; outline:none;">
        </div>
    </div>
    <div style="padding:0 12px 8px; background:#0f0f0f;">
        <div id="searchResults" style="display:none; max-height:300px; overflow-y:auto; margin-top:6px;"></div>
    </div>
    <audio id="cc-stream-audio" preload="auto" style="display:none;"></audio>
    <style>@keyframes ccPulse{0%{box-shadow:0 0 0 0 rgba(109,40,217,.6);}70%{box-shadow:0 0 0 14px rgba(109,40,217,0);}100%{box-shadow:0 0 0 0 rgba(109,40,217,0);}}
    @media (min-width:820px){
        #cc-toprow{display:flex; align-items:center; gap:8px;}
        #cc-listen-bar{flex:0 0 auto;}
        #cc-search-bar{flex:1;}
        #cc-toprow #cc-stream-btn{width:auto; padding:10px 18px; font-size:.92rem;}
    }</style>
    <script src="/static/browser_audio.js"></script>

    <div class="section-tabs" id="mainTabs">
        <button class="active" onclick="showSection('songs')">🎵 Songs</button>
        <button onclick="showSection('sfx')">💥 SFX</button>
        <button onclick="showSection('dcc')">🎙 DCC</button>
        <button onclick="showSection('add')">➕ Add</button>
    </div>
    <div class="section-tabs" id="sfxSubTabs" style="display:none; background:#111;">
        <button class="active" onclick="showSfxCat('react')">React</button>
        <button onclick="showSfxCat('anime_quotes')">Anime</button>
        <button onclick="showSfxCat('gaming')">Gaming</button>
        <button onclick="showSfxCat('meme_clips')">Memes</button>
    </div>

    <!-- SONGS (Sound 1) -->
    <div id="section-songs" class="panel active">
        <div class="group-tabs" id="groupTabs"></div>
        <button class="random-btn" id="shuffleGroupBtn" onclick="shuffleGroup()" style="display:none">
            🔀 Shuffle play this group
        </button>
        <div class="song-grid" id="songGrid">
            <div class="loading">Loading songs...</div>
        </div>
    </div>

    <!-- SLOTS 2-7 (hidden, accessed from Add section) -->
    <div id="section-slots" class="panel" style="display:none;"></div>

    <!-- DCC QUOTES (Sound 8) -->
    <div id="section-dcc" class="panel">
        <div class="dcc-cat-tabs" id="dccTabs"></div>
        <button class="random-btn" onclick="playDccRandom()">
            🎲 Random from current category
        </button>
        <div class="song-grid" id="dccGrid">
            <div class="loading">Loading quotes...</div>
        </div>
    </div>

    <!-- SFX -->
    <div id="section-sfx" class="panel">
        <button class="random-btn" id="sfxRandomBtn" onclick="playRandomSfx()">
            🎰 Random from this category
        </button>
        <div class="song-grid" id="sfxGrid">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <!-- ADD SONG -->
    <div id="section-add" class="panel">
        <div id="cc-studio-mount"></div>
        <div class="add-form" style="display:none;">
            <div style="display:flex; gap:6px; margin-bottom:8px;">
                <button id="tabYoutube" onclick="showAddTab('youtube')" style="flex:1; padding:10px; border:2px solid #e94560; border-radius:8px; background:#e94560; color:white; font-weight:600; cursor:pointer;">Paste link</button>
                <button id="tabUpload" onclick="showAddTab('upload')" style="flex:1; padding:10px; border:2px solid #333; border-radius:8px; background:#16213e; color:#aaa; font-weight:600; cursor:pointer;">Upload File</button>
                <button id="tabSfx" onclick="showAddTab('sfx_upload')" style="flex:1; padding:10px; border:2px solid #333; border-radius:8px; background:#16213e; color:#aaa; font-weight:600; cursor:pointer;">Upload SFX</button>
            </div>
            <div id="addYoutube">
                <input type="text" id="addUrl" placeholder="YouTube / TikTok / link URL">
            </div>
            <div id="addUpload" style="display:none;">
                <input type="file" id="addFile" accept="audio/*,video/*" style="width:100%; padding:12px; border:1px solid #333; border-radius:8px; background:#16213e; color:#e0e0e0; margin-bottom:8px;">
            </div>
            <div id="addSfxUpload" style="display:none;">
                <input type="file" id="addSfxFile" accept="audio/*,video/*" style="width:100%; padding:12px; border:1px solid #333; border-radius:8px; background:#16213e; color:#e0e0e0; margin-bottom:8px;">
                <input type="text" id="sfxName" placeholder="SFX name (e.g. funny sound)">
            </div>
            <div id="songFields">
                <input type="text" id="addName" placeholder="Song name (e.g. rivers in the desert)">
                <select id="addGroup" onchange="onGroupChange()">
                    <option value="">-- Pick a group --</option>
                </select>
                <input type="text" id="newGroupName" placeholder="New group name" style="display:none;">
                <div id="addNumberInfo" style="text-align:center; padding:4px; color:#666; font-size:0.8rem;"></div>
            </div>
            <button onclick="addSong()" id="addBtn">Download & Add</button>
            <button onclick="ccOpenStudio()" id="ccStudioBtn" style="width:100%;margin-top:8px;padding:12px;border:none;border-radius:8px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;">✂️ Open Clip Studio — trim / edit / cut clips</button>
            <div id="addStatus" style="text-align:center; padding:8px; color:#4ecca3;"></div>
        </div>
        <div style="display:none; margin-top:20px; padding-top:16px; border-top:1px solid #333;">
            <div style="text-align:center; color:#666; font-size:0.8rem; margin-bottom:8px;">Physical Buttons 2-7</div>
            <div class="slot-grid">
                <button class="slot-btn" onclick="playSlot(2)">🎲 Btn 2</button>
                <button class="slot-btn" onclick="playSlot(3)">Btn 3</button>
                <button class="slot-btn" onclick="playSlot(4)">Btn 4</button>
                <button class="slot-btn" onclick="playSlot(5)">Btn 5</button>
                <button class="slot-btn" onclick="playSlot(6)">Btn 6</button>
                <button class="slot-btn" onclick="playSlot(7)">Btn 7</button>
            </div>
        </div>
    </div>

    <!-- Keep hidden elements for backward compat -->
    <div id="nowPlaying" style="display:none;"><div id="npTitle"></div><div id="npTime"></div></div>

    <script>
        let songData = null;
        let currentGroup = null;
        let dccData = null;
        let currentDccCat = null;

        // Section switching
        function showSection(name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('#mainTabs button').forEach(b => b.classList.remove('active'));
            document.getElementById('section-' + name).classList.add('active');
            if (event && event.target) event.target.classList.add('active');
            // Show/hide SFX sub-tabs
            document.getElementById('sfxSubTabs').style.display = name === 'sfx' ? 'flex' : 'none';
            if (name === 'sfx') {
                loadSfxCategory(currentSfxCat);
            }
        }

        // Load songs
        async function loadSongs() {
            try {
                const res = await fetch('/api/songs');
                songData = await res.json();
                renderGroupTabs();
                if (songData.groups.length > 0) {
                    selectGroup(songData.groups[0].name);
                }
                populateGroupDropdown();
            } catch (e) {
                document.getElementById('songGrid').innerHTML =
                    '<div class="loading">Failed to connect to Pi</div>';
            }
        }

        function renderGroupTabs() {
            const tabs = document.getElementById('groupTabs');
            tabs.innerHTML = '';
            for (const group of songData.groups) {
                const btn = document.createElement('button');
                btn.textContent = group.name;
                btn.onclick = () => selectGroup(group.name);
                tabs.appendChild(btn);
            }
        }

        async function shuffleGroup() {
            if (!currentGroup) return;
            await fetch('/api/play/shuffle_group', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({group: currentGroup})
            });
            updateStatus();
        }

        function selectGroup(groupName) {
            currentGroup = groupName;
            // Show shuffle button
            const shuffleBtn = document.getElementById('shuffleGroupBtn');
            shuffleBtn.style.display = 'block';
            shuffleBtn.textContent = `🔀 Shuffle play "${groupName}"`;
            // Update tab styles
            document.querySelectorAll('.group-tabs button').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === groupName);
            });
            // Render songs
            const group = songData.groups.find(g => g.name === groupName);
            const grid = document.getElementById('songGrid');
            if (!group || group.songs.length === 0) {
                grid.innerHTML = '<div class="loading">No songs in this group</div>';
                return;
            }
            grid.innerHTML = '';
            for (const song of group.songs) {
                const btn = document.createElement('button');
                btn.className = 'song-btn';
                btn.innerHTML = `<span class="song-num">#${song.number}</span>${song.display}`;
                btn.onclick = () => playSong(song.filename, btn);
                grid.appendChild(btn);
            }
        }

        async function playSong(filename, btnEl) {
            if (btnEl) {
                btnEl.classList.add('playing');
                setTimeout(() => btnEl.classList.remove('playing'), 2000);
            }
            await fetch('/api/play/sound1', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({filename})
            });
            updateStatus();
        }

        async function playSlot(slot) {
            if (slot === 2) {
                await fetch('/api/slot2/play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename: 'random'})
                });
            } else {
                await fetch(`/api/play/slot/${slot}`, {method: 'POST'});
            }
            updateStatus();
        }

        // DCC quotes
        async function loadDcc() {
            try {
                const res = await fetch('/api/dcc/categories');
                dccData = await res.json();
                renderDccTabs();
                if (dccData.categories.length > 0) {
                    selectDccCat(dccData.categories[0].name);
                }
            } catch (e) {
                document.getElementById('dccGrid').innerHTML =
                    '<div class="loading">Failed to load</div>';
            }
        }

        function renderDccTabs() {
            const tabs = document.getElementById('dccTabs');
            tabs.innerHTML = '';
            for (const cat of dccData.categories) {
                const btn = document.createElement('button');
                btn.textContent = `${cat.name} (${cat.count})`;
                btn.onclick = () => selectDccCat(cat.name);
                tabs.appendChild(btn);
            }
        }

        async function selectDccCat(catName) {
            currentDccCat = catName;
            document.querySelectorAll('.dcc-cat-tabs button').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.startsWith(catName));
            });

            const res = await fetch(`/api/dcc/clips/${catName}`);
            const data = await res.json();
            const grid = document.getElementById('dccGrid');
            grid.innerHTML = '';

            for (const clip of data.clips) {
                const btn = document.createElement('button');
                btn.className = 'song-btn';
                // Parse clip name for display
                let display = clip.replace('.wav', '').replace(/^[0-9-]+_/, '').replace(/_/g, ' ');
                btn.textContent = display;
                btn.onclick = () => playDccClip(catName, clip, btn);
                grid.appendChild(btn);
            }
        }

        async function playDccRandom() {
            const cat = currentDccCat || 'all';
            await fetch('/api/play/dcc', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({category: cat})
            });
            updateStatus();
        }

        async function playDccClip(category, filename, btnEl) {
            if (btnEl) {
                btnEl.classList.add('playing');
                setTimeout(() => btnEl.classList.remove('playing'), 2000);
            }
            await fetch('/api/play/dcc/clip', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({category, filename})
            });
            updateStatus();
        }

        async function togglePause() {
            const res = await fetch('/api/pause', {method: 'POST'});
            const data = await res.json();
            updateStatus();
        }

        async function skipTrack() {
            await fetch('/api/skip', {method: 'POST'});
        }

        let addMode = 'youtube';
        function showAddTab(mode) {
            addMode = mode;
            document.getElementById('addYoutube').style.display = mode === 'youtube' ? 'block' : 'none';
            document.getElementById('addUpload').style.display = mode === 'upload' ? 'block' : 'none';
            document.getElementById('addSfxUpload').style.display = mode === 'sfx_upload' ? 'block' : 'none';
            document.getElementById('songFields').style.display = mode === 'sfx_upload' ? 'none' : 'block';
            document.getElementById('tabYoutube').style.background = mode === 'youtube' ? '#e94560' : '#16213e';
            document.getElementById('tabYoutube').style.borderColor = mode === 'youtube' ? '#e94560' : '#333';
            document.getElementById('tabYoutube').style.color = mode === 'youtube' ? 'white' : '#aaa';
            document.getElementById('tabUpload').style.background = mode === 'upload' ? '#e94560' : '#16213e';
            document.getElementById('tabUpload').style.borderColor = mode === 'upload' ? '#e94560' : '#333';
            document.getElementById('tabUpload').style.color = mode === 'upload' ? 'white' : '#aaa';
            document.getElementById('tabSfx').style.background = mode === 'sfx_upload' ? '#e94560' : '#16213e';
            document.getElementById('tabSfx').style.borderColor = mode === 'sfx_upload' ? '#e94560' : '#333';
            document.getElementById('tabSfx').style.color = mode === 'sfx_upload' ? 'white' : '#aaa';
            document.getElementById('addBtn').textContent = mode === 'youtube' ? 'Download & Add' : 'Upload & Add';
        }

        function adjustVolume(delta) {
            const slider = document.getElementById('volumeSlider');
            let val = Math.max(0, Math.min(100, parseInt(slider.value) + delta));
            slider.value = val;
            setVolume(val);
        }

        let volumeDebounce = null;
        let volumeReady = false;
        async function setVolume(val) {
            if (!volumeReady) return; // don't set volume until we've loaded the real value
            document.getElementById('volumeLabel').textContent = val + '%';
            clearTimeout(volumeDebounce);
            volumeDebounce = setTimeout(async () => {
                await fetch('/api/volume', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({volume: parseInt(val)})
                });
            }, 150);
        }

        async function loadVolume() {
            try {
                const res = await fetch('/api/volume');
                const data = await res.json();
                const slider = document.getElementById('volumeSlider');
                slider.value = data.volume;
                document.getElementById('volumeLabel').textContent = data.volume + '%';
                volumeReady = true;
            } catch(e) {
                volumeReady = true;
            }
        }

        async function stopPlayback() {
            await fetch('/api/stop', {method: 'POST'});
            updateStatus();
        }

        function populateGroupDropdown() {
            const select = document.getElementById('addGroup');
            while (select.options.length > 1) select.remove(1);
            // New group option first
            const newOpt = document.createElement('option');
            newOpt.value = '__new__';
            newOpt.textContent = '+ Create new group';
            select.appendChild(newOpt);
            // Then existing groups
            if (songData) {
                for (const group of songData.groups) {
                    if (group.name === 'All') continue;
                    const opt = document.createElement('option');
                    opt.value = group.name;
                    opt.textContent = `${group.name} (${group.songs.length} songs)`;
                    select.appendChild(opt);
                }
            }
        }

        function onGroupChange() {
            const select = document.getElementById('addGroup');
            const newGroupInput = document.getElementById('newGroupName');
            if (select.value === '__new__') {
                newGroupInput.style.display = 'block';
                newGroupInput.focus();
                document.getElementById('addNumberInfo').textContent = 'Will create a new group';
            } else {
                newGroupInput.style.display = 'none';
                newGroupInput.value = '';
                updateNextNumber();
            }
        }

        async function updateNextNumber() {
            const group = document.getElementById('addGroup').value;
            const info = document.getElementById('addNumberInfo');
            try {
                const url = group ? `/api/next_number?group=${encodeURIComponent(group)}` : '/api/next_number';
                const res = await fetch(url);
                const data = await res.json();
                if (group && data.range) {
                    info.textContent = `Will be #${data.next} (group range: ${data.range[0]}-${data.range[1]})`;
                } else {
                    info.textContent = `Will be #${data.next}`;
                }
            } catch (e) {
                info.textContent = '';
            }
        }

        async function addSong() {
            const btn = document.getElementById('addBtn');
            const status = document.getElementById('addStatus');
            btn.disabled = true;

            if (addMode === 'sfx_upload') {
                const file = document.getElementById('addSfxFile').files[0];
                const name = document.getElementById('sfxName').value;
                if (!file || !name) {
                    status.textContent = 'Need a file and name';
                    status.style.color = '#e94560';
                    btn.disabled = false;
                    return;
                }
                status.textContent = 'Uploading...';
                status.style.color = '#4ecca3';
                const formData = new FormData();
                formData.append('file', file);
                formData.append('name', name);
                try {
                    const res = await fetch('/api/upload/sfx', {method: 'POST', body: formData});
                    const data = await res.json();
                    if (res.ok) {
                        status.textContent = `Added SFX: ${data.filename}`;
                        document.getElementById('addSfxFile').value = '';
                        document.getElementById('sfxName').value = '';
                        loadSfx();
                    } else {
                        status.textContent = data.error;
                        status.style.color = '#e94560';
                    }
                } catch (e) {
                    status.textContent = 'Failed to upload';
                    status.style.color = '#e94560';
                }
                btn.disabled = false;
                return;
            }

            const name = document.getElementById('addName').value;
            const groupSelect = document.getElementById('addGroup').value;
            const newGroupName = document.getElementById('newGroupName').value;

            if (!name) {
                status.textContent = 'Need a name';
                status.style.color = '#e94560';
                btn.disabled = false;
                return;
            }
            if (groupSelect === '__new__' && !newGroupName) {
                status.textContent = 'Enter a name for the new group';
                status.style.color = '#e94560';
                btn.disabled = false;
                return;
            }

            if (addMode === 'upload') {
                const file = document.getElementById('addFile').files[0];
                if (!file) {
                    status.textContent = 'Need a file';
                    status.style.color = '#e94560';
                    btn.disabled = false;
                    return;
                }
                status.textContent = 'Uploading...';
                status.style.color = '#4ecca3';
                const formData = new FormData();
                formData.append('file', file);
                formData.append('name', name);
                if (groupSelect === '__new__') formData.append('new_group', newGroupName);
                else if (groupSelect) formData.append('group', groupSelect);
                try {
                    const res = await fetch('/api/upload/song', {method: 'POST', body: formData});
                    const data = await res.json();
                    if (res.ok) {
                        let msg = `Added: ${data.filename}`;
                        if (data.group) msg += ` → ${data.group}`;
                        status.textContent = msg;
                        document.getElementById('addFile').value = '';
                        document.getElementById('addName').value = '';
                        document.getElementById('newGroupName').value = '';
                        document.getElementById('newGroupName').style.display = 'none';
                        loadSongs();
                    } else {
                        status.textContent = data.error;
                        status.style.color = '#e94560';
                    }
                } catch (e) {
                    status.textContent = 'Failed to upload';
                    status.style.color = '#e94560';
                }
            } else {
                const url = document.getElementById('addUrl').value;
                if (!url) {
                    status.textContent = 'Need a URL';
                    status.style.color = '#e94560';
                    btn.disabled = false;
                    return;
                }
                status.textContent = 'Downloading...';
                status.style.color = '#4ecca3';
                const body = {url, name};
                if (groupSelect === '__new__') body.new_group = newGroupName;
                else if (groupSelect) body.group = groupSelect;
                try {
                    const res = await fetch('/api/add', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();
                    if (res.ok) {
                        let msg = `Added: ${data.filename} (#${data.number})`;
                        if (data.group) msg += ` → ${data.group}`;
                        status.textContent = msg;
                        document.getElementById('addUrl').value = '';
                        document.getElementById('addName').value = '';
                        document.getElementById('newGroupName').value = '';
                        document.getElementById('newGroupName').style.display = 'none';
                        loadSongs();
                    } else {
                        status.textContent = data.error;
                        status.style.color = '#e94560';
                    }
                } catch (e) {
                    status.textContent = 'Failed to connect';
                    status.style.color = '#e94560';
                }
            }
            btn.disabled = false;
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const dot = document.getElementById('statusDot');
                dot.classList.remove('connected', 'playing');
                if (data.playing) dot.classList.add('playing');
                else if (data.connected) dot.classList.add('connected');

                const npTitle = document.getElementById('npTitle');
                const npTime = document.getElementById('npTime');
                const pauseBtn = document.getElementById('pauseBtnHeader');
                const npTitleH = document.getElementById('npTitleHeader');
                const npTimeH = document.getElementById('npTimeHeader');
                if (data.playing && data.now_playing) {
                    let label = data.now_playing;
                    if (data.shuffling) label = '🔀 ' + label;
                    if (data.paused) label = '⏸ ' + label;
                    npTitleH.textContent = label;
                    npTimeH.textContent = `${formatTime(data.elapsed)} / ${formatTime(data.duration)}`;
                    pauseBtn.textContent = data.paused ? '▶️' : '⏸';
                    pauseBtn.style.background = data.paused ? '#27ae60' : '#7f8c8d';
                } else {
                    npTitleH.textContent = 'Nothing playing';
                    npTimeH.textContent = '';
                    pauseBtn.textContent = '⏸';
                    pauseBtn.style.background = '#7f8c8d';
                }
            } catch (e) {}
        }

        // SFX
        let currentSfxCat = 'react';

        function showSfxCat(cat) {
            currentSfxCat = cat;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('section-sfx').classList.add('active');
            document.getElementById('sfxSubTabs').style.display = 'flex';
            // Highlight main SFX tab
            document.querySelectorAll('#mainTabs button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('#mainTabs button').forEach(b => {
                if (b.textContent.includes('SFX')) b.classList.add('active');
            });
            // Highlight sub-tab
            const tabMap = {'react':'React','anime_quotes':'Anime','gaming':'Gaming','meme_clips':'Memes'};
            document.querySelectorAll('#sfxSubTabs button').forEach(b => {
                b.classList.toggle('active', b.textContent === tabMap[cat]);
            });
            loadSfxCategory(cat);
        }

        async function loadSfxCategory(cat) {
            try {
                const res = await fetch(`/api/sfx/list/${cat}`);
                const data = await res.json();
                const grid = document.getElementById('sfxGrid');
                grid.innerHTML = '';
                const catDisplay = cat.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
                document.getElementById('sfxRandomBtn').textContent = `🎰 Random ${catDisplay}`;
                for (const clip of data.clips) {
                    const btn = document.createElement('button');
                    btn.className = 'song-btn';
                    btn.textContent = clip.display;
                    btn.onclick = () => playSfx(clip.filename, clip.category, btn);
                    grid.appendChild(btn);
                }
                if (data.clips.length === 0) {
                    grid.innerHTML = '<div class="loading">No clips yet</div>';
                }
            } catch (e) {
                document.getElementById('sfxGrid').innerHTML = '<div class="loading">Failed to load</div>';
            }
        }

        async function loadSfx() {
            loadSfxCategory('react');
        }

        async function playSfx(filename, category, btnEl) {
            if (btnEl) {
                btnEl.classList.add('playing');
                setTimeout(() => btnEl.classList.remove('playing'), 2000);
            }
            await fetch('/api/sfx/play', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({filename, category: category || currentSfxCat})
            });
            updateStatus();
        }

        async function playRandomSfx() {
            await fetch('/api/sfx/play', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({filename: 'random', category: currentSfxCat})
            });
            updateStatus();
        }

        // Search
        let searchDebounce = null;
        async function doSearch(query) {
            const resultsDiv = document.getElementById('searchResults');
            if (!query || query.length < 2) {
                resultsDiv.style.display = 'none';
                resultsDiv.innerHTML = '';
                return;
            }
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    resultsDiv.style.display = 'block';
                    if (data.results.length === 0) {
                        resultsDiv.innerHTML = '<div style="padding:8px; color:#666; text-align:center;">No results</div>';
                        return;
                    }
                    resultsDiv.innerHTML = '';
                    for (const r of data.results) {
                        const btn = document.createElement('button');
                        btn.className = 'song-btn';
                        btn.style.width = '100%';
                        btn.style.margin = '2px 0';
                        btn.style.textAlign = 'left';
                        let label = r.display;
                        let tag = r.type === 'sfx' ? '🔊' : r.type === 'dcc' ? '🎙' : '🎵';
                        btn.innerHTML = `${tag} ${label}`;
                        btn.onclick = () => {
                            if (r.type === 'song') {
                                playSong(r.filename, btn);
                            } else if (r.type === 'sfx') {
                                playSfx(r.filename, btn);
                            } else if (r.type === 'dcc') {
                                playDccClip(r.category, r.filename, btn);
                            }
                        };
                        resultsDiv.appendChild(btn);
                    }
                } catch (e) {}
            }, 300);
        }

        // Init
        loadSongs();
        loadSfx();
        loadVolume();
        loadDcc();
        updateStatus();
        setInterval(updateStatus, 2000);
    </script>
