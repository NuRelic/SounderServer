<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Recipes</title>
<style>
  :root{
    --bg:#111418; --panel:#171c23; --panel2:#1e242c; --line:rgba(255,255,255,.08);
    --txt:#e8eaed; --dim:rgba(232,234,237,.45); --accent:#6aa9ff; --go:#3d8b5f;
    /* height of the sticky header, measured after every render — section
       headers stick just below it instead of sliding underneath. */
    --hdh:0px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:400 17px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain}
  /* the home indicator sits over the bottom of the screen; keep the last row clear */
  body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:5;background:var(--panel);
    border-bottom:1px solid var(--line);padding:8px 16px 12px}
  header .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  header h1{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:0}
  header .meta{font-size:15px;color:var(--dim);white-space:nowrap}
  /* 16px keeps iOS from zooming the page when the field takes focus */
  input.name{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:7px 9px;font-size:16px;width:112px;font-family:inherit}
  .search{width:100%;margin-top:10px;padding:12px 13px;border-radius:11px;
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font-size:16px;font-family:inherit}
  /* a form field in the body of a screen, rather than in the header */
  .fld{display:block;width:100%;min-height:44px;padding:12px 13px;border-radius:11px;
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font-size:16px;font-family:inherit}
  textarea.fld{line-height:1.4;resize:vertical}
  select.fld{-webkit-appearance:none;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
                     linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
  .row{display:flex;align-items:center;gap:14px;padding:11px 16px;min-height:56px;
    border-bottom:1px solid rgba(255,255,255,.05);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  .row:active{background:var(--panel2)}
  .row .nm{flex:1;min-width:0}
  .row .nm b{font-weight:500;display:block}
  .row .nm small{display:block;color:var(--dim);font-size:14px;margin-top:2px}
  .row .qty{color:var(--dim);font-size:15px;text-align:right;flex:none}
  .sec{padding:12px 16px 8px;font-size:14px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--dim);background:#151920;border-top:1px solid var(--line);
    position:sticky;top:var(--hdh);z-index:1}
  .bx{width:26px;height:26px;border-radius:7px;border:2px solid rgba(255,255,255,.3);
    flex:none;text-align:center;line-height:23px;font-size:16px}
  .bx.on{background:var(--go);border-color:var(--go);color:#fff}
  /* A store-list row commits on a horizontal drag, never on a tap — a thumb
     scrolling a long list crosses every row and used to check them off. The row
     slides on top of the action panel it reveals; only list rows get wrapped,
     the other tabs keep the plain .row. pan-y leaves vertical scroll to the
     browser until the drag proves itself horizontal. */
  .swipe{position:relative;overflow:hidden}
  .swipe > .row{position:relative;background:var(--bg);touch-action:pan-y;
    transition:transform .17s ease-out}
  .swact{position:absolute;inset:0;display:flex;align-items:center;
    padding:0 21px;font-size:21px;color:#fff;background:var(--go);opacity:.5}
  .swact.rev{justify-content:flex-end;background:var(--panel2);color:var(--dim)}
  .swact.armed{opacity:1}
  .fold{display:flex;align-items:center;min-height:48px;padding:13px 16px;font-size:15px;
    color:var(--dim);background:#13171d;border-bottom:1px solid var(--line);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  .fold:active{background:var(--panel2)}
  .btn{display:block;width:calc(100% - 32px);margin:16px;padding:16px;border:0;
    border-radius:14px;background:var(--go);color:#fff;font-size:17px;font-weight:600;
    font-family:inherit;touch-action:manipulation}
  .btn.quiet{background:var(--panel2);color:var(--txt)}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
  nav button{flex:1;background:0;border:0;color:var(--dim);font-size:14px;
    padding:9px 0 9px;font-family:inherit;min-height:56px;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  nav button em{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
  nav button.sel{color:var(--accent)}
  .empty{padding:48px 24px;text-align:center;color:var(--dim)}
  /* Browse is dense rows, not photo cards — a recipe has to be addable with
     nothing but a name and ingredients, so the picture can never be the hook. */
  .thumb{width:46px;height:46px;border-radius:10px;flex:none;font-size:24px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2a3742,#1d2830);
    background-size:cover;background-position:center}
  /* the circle is 34px for looks; the box around it is the 44px you actually hit */
  .plus{flex:none;width:44px;height:44px;display:flex;align-items:center;
    justify-content:center}
  .plus i{width:34px;height:34px;border-radius:50%;font-style:normal;font-size:21px;
    line-height:31px;text-align:center;border:2px solid rgba(255,255,255,.28);
    color:var(--dim)}
  .plus.on i{border-color:var(--go);background:var(--go);color:#fff;font-size:17px}
  .lbl{padding:14px 16px 5px;color:var(--dim);font-size:14px}
  .pad{padding:0 16px}
  .prose{padding:14px 16px;white-space:pre-wrap}
  /* the filing panel, opened in place under the pantry row it belongs to */
  .panel{background:#141920;border-bottom:1px solid var(--line);padding:2px 0 14px;
    box-shadow:inset 0 8px 12px -10px #000}
  .panel .btn{margin:14px 16px 0}
  .strip{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;margin:0 -16px;
    border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
  .strip span{flex:none;display:inline-flex;align-items:center;min-height:44px;
    padding:6px 14px;border-radius:22px;background:var(--panel2);font-size:15px;
    white-space:nowrap;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .strip span:active{background:#2a323c}
  .toast{position:fixed;left:16px;right:16px;z-index:20;text-align:center;
    bottom:calc(88px + env(safe-area-inset-bottom));
    background:#3a2228;border:1px solid #6d3a44;color:var(--txt);
    padding:13px 14px;border-radius:12px;font-size:15px}
  /* the undo bar owns the low slot, under the thumb; an error toast steps above
     it on the rare occasion both are up */
  .undo{position:fixed;left:16px;right:16px;z-index:21;display:flex;
    align-items:center;gap:12px;bottom:calc(88px + env(safe-area-inset-bottom));
    background:#1b2b22;border:1px solid #35614a;color:var(--txt);
    padding:9px 9px 9px 14px;border-radius:12px;font-size:15px}
  .undo .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .undo button{flex:none;background:var(--go);border:0;border-radius:9px;color:#fff;
    font-family:inherit;font-size:15px;font-weight:600;padding:0 18px;min-height:44px;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  body.hasundo .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
  /* login sheet — rises from the bottom so the field sits under the thumb */
  .login{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);
    display:flex;align-items:flex-end}
  .login .card{width:100%;background:var(--panel);border-radius:16px 16px 0 0;
    border-top:1px solid var(--line);
    padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .login .card .btn{width:100%;margin:10px 0 0}
  .login .err{color:#f0a0a8;font-size:15px;padding:8px 2px 0}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1 id="title">Recipes</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="meta" id="count"></span>
      <input class="name" id="name" placeholder="your name">
    </div>
  </div>
  <div id="hdextra"></div>
</header>

<main id="main"></main>

<nav>
  <button data-tab="recipes" class="sel"><em>📖</em>Recipes</button>
  <button data-tab="list"><em>🛒</em>List</button>
  <button data-tab="pantry"><em>🧂</em>Pantry</button>
</nav>

<script>
const $  = s => document.querySelector(s);
const el = (t, c, h) => { const n=document.createElement(t);
  if(c) n.className=c; if(h!=null) n.innerHTML=h; return n; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Display name is shared with the soundboard — same localStorage key, so if you
// have ever used the soundboard your name is already filled in here.
$('#name').value = localStorage.getItem('ss_name') || '';
$('#name').onchange = () => localStorage.setItem('ss_name', $('#name').value.trim());
const who = () => $('#name').value.trim() || 'someone';

// A write that quietly does nothing is the worst failure mode in a store, so
// say so. Reads stay silent apart from a refused login.
let TOAST_T = null;
function note(msg){
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = el('div','toast', esc(msg));
  document.body.appendChild(t);
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => t.remove(), 4000);
}

// Writes are gated by the site-wide session, which the soundboard's modal sets.
// Somebody who opens /recipes/ first has no way to reach that modal, so ask for
// the password right here and replay whatever got refused. Same session, same
// /api/login endpoint — this is an affordance, not a second auth system.
let LOGIN_ASK = null;      // one sheet no matter how many calls are refused

function askLogin(){
  if (LOGIN_ASK) return LOGIN_ASK;
  LOGIN_ASK = new Promise(resolve => {
    const wrap = el('div','login');
    const card = el('div','card');
    card.appendChild(el('div', null,
      '<b style="font-size:19px">Log in to make changes</b>' +
      '<div style="color:var(--dim);font-size:15px;margin-top:4px">' +
      'The same password as the soundboard.</div>'));

    const pw = document.createElement('input');
    pw.type = 'password'; pw.className = 'fld'; pw.id = 'loginpw';
    pw.placeholder = 'Password'; pw.autocomplete = 'current-password';
    pw.style.marginTop = '14px';
    card.appendChild(pw);

    const err = el('div','err','');
    card.appendChild(err);

    const finish = ok => { wrap.remove(); LOGIN_ASK = null; resolve(ok); };
    const go = el('button','btn','Log in');
    const submit = async () => {
      if (go.disabled) return;
      go.disabled = true; err.textContent = '';
      let r = null;
      try {
        r = await fetch('/api/login', {method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({password: pw.value})});
      } catch (e) { /* offline — fall through to the message below */ }
      go.disabled = false;
      if (r && r.ok) return finish(true);
      err.textContent = r ? 'That password did not work.' : 'No connection.';
      pw.value = ''; pw.focus();
    };
    go.onclick = submit;
    pw.onkeydown = e => { if (e.key === 'Enter') submit(); };
    card.appendChild(go);

    const no = el('button','btn quiet','Not now');
    no.onclick = () => finish(false);
    card.appendChild(no);

    wrap.appendChild(card);
    document.body.appendChild(wrap);
    pw.focus();
  });
  return LOGIN_ASK;
}

const api = async (path, opts={}) => {
  const o = {headers:{'Content-Type':'application/json'}, ...opts};
  if (o.body && typeof o.body === 'object') o.body = JSON.stringify({...o.body, who: who()});
  let r;
  try { r = await fetch('/recipes/api' + path, o); }
  catch (e) {
    if (o.method) note('No connection — that change did not save.');
    return null;
  }
  if (!r.ok) {
    console.warn('api', path, r.status);
    if (r.status === 403 && !opts.retried) {
      // Ask, then send the very same request again — nobody has to remember
      // what they were doing when the refusal landed.
      if (await askLogin()) return api(path, {...opts, retried: true});
      note('Not logged in — that change did not save.');
      return null;
    }
    if (r.status === 403) note('Log in to make changes.');
    else if (o.method) note('That did not save (' + r.status + ').');
    return null;
  }
  return r.json();
};

let TAB = 'recipes';
let STATE = {recipes: [], list: null, pantry: [], sections: [],
             version: -1, queued: new Set()};

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  TAB = b.dataset.tab;
  clearUndo();                    // nothing to undo once you've left the list
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('sel', x===b));
  render();                       // switch instantly…
  refresh();                      // …then top up whatever this tab needs
  if (TAB === 'list') poll();     // and take the newest list state
});

function render(){
  // Anything focused inside the header is about to be destroyed and rebuilt;
  // remember it so a background poll can't eat what someone is typing.
  const focused = document.activeElement && document.activeElement.id;
  $('#hdextra').innerHTML = '';
  if (TAB === 'recipes') renderRecipes(focused);
  else if (TAB === 'list') renderList(focused);
  else renderPantry(focused);
  measureHeader();
}

// Swap #main for a freshly built screen. Every screen ends this way.
function paint(main){
  $('#main').innerHTML = '';
  $('#main').appendChild(main);
  measureHeader();
}

// A search box in the header. It re-renders on every keystroke, which destroys
// the field — hand the caret back, the way the list's add box does.
function searchBox(id, placeholder, value, onchange, focused){
  const box = el('input','search');
  box.id = id;
  box.placeholder = placeholder;
  box.value = value;
  box.oninput = () => onchange(box.value);
  $('#hdextra').appendChild(box);
  if (focused === id){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  return box;
}

// Section headers stick below the page header, whose height changes with the
// meal strip and the add field.
function measureHeader(){
  const h = document.querySelector('header');
  if (h) document.documentElement.style.setProperty('--hdh', h.offsetHeight + 'px');
}
window.addEventListener('resize', measureHeader);

// ---- recipes ----------------------------------------------------------------
// Dense rows, seven to a screen. Thumbnail, name, the one line of provenance
// that tells you whether you want it, and a ⊕ to queue it for the list.

let RECIPE_FILTER = '';

function recipeBits(r){
  return [r.time_minutes ? r.time_minutes + ' min' : '',
          r.servings ? 'serves ' + r.servings : '',
          r.source_name || ''].filter(Boolean).join(' · ');
}

function thumb(r){
  const t = el('div','thumb', r.photo_url ? '' : '🍽️');
  // set as a property, never interpolated into markup — a recipe URL is
  // user-typed and would otherwise be an injection point.
  if (r.photo_url) t.style.backgroundImage = 'url("' + r.photo_url.replace(/["\\]/g,'') + '")';
  return t;
}

function renderRecipes(focused){
  $('#title').textContent = 'Recipes';
  $('#count').textContent = STATE.queued.size
    ? STATE.queued.size + ' selected'
    : (STATE.recipes.length ? STATE.recipes.length + ' saved' : '');

  searchBox('rsearch', 'Search recipes…', RECIPE_FILTER,
            v => { RECIPE_FILTER = v; render(); }, focused);

  const main = el('div');
  const q = RECIPE_FILTER.trim().toLowerCase();
  const shown = STATE.recipes.filter(r => !q ||
    r.name.toLowerCase().includes(q) ||
    (r.source_name || '').toLowerCase().includes(q));

  if (!shown.length) main.appendChild(el('div','empty',
    STATE.recipes.length ? 'No matches.' : 'No recipes yet.<br>Add one below.'));

  shown.forEach(r => {
    const row = el('div','row');
    row.appendChild(thumb(r));

    const nm = el('div','nm',
      '<b>' + esc(r.name) + '</b><small>' + esc(recipeBits(r)) + '</small>');
    row.appendChild(nm);

    const queued = STATE.queued.has(r.id);
    const plus = el('div','plus' + (queued ? ' on' : ''),
                    '<i>' + (queued ? '✓' : '+') + '</i>');
    plus.onclick = e => {
      e.stopPropagation();
      queued ? STATE.queued.delete(r.id) : STATE.queued.add(r.id);
      render();
    };
    row.appendChild(plus);

    // the whole row opens it; only the little circle queues it
    row.onclick = () => openRecipe(r.id);
    main.appendChild(row);
  });

  if (STATE.queued.size){
    const go = el('button','btn', 'Add ' + STATE.queued.size + ' to list');
    go.onclick = () => runAddSheets([...STATE.queued]);
    main.appendChild(go);
  }

  const add = el('button','btn quiet','+ New recipe');
  add.onclick = () => openRecipeEditor(null);
  main.appendChild(add);

  paint(main);
}

// One sheet per queued recipe, in sequence — you confirm each, then it moves on.
async function runAddSheets(ids){
  for (const id of ids){
    const r = await api('/recipes/' + id);
    if (r) await addSheet(r);
    STATE.queued.delete(id);
  }
  const fresh = await api('/list');
  if (fresh) { STATE.list = fresh; STATE.version = fresh.version; }
  TAB = 'list';
  document.querySelectorAll('nav button').forEach(
    x => x.classList.toggle('sel', x.dataset.tab === 'list'));
  render();
}

// Everything arrives checked, so the job in the kitchen is to uncheck what is
// already in the fridge. Staples are the exception: they arrive off and folded,
// so nobody re-decides about salt every single time.
function addSheet(recipe){
  return new Promise(resolve => {
    $('#title').textContent = recipe.name;
    $('#count').textContent = '';
    $('#hdextra').innerHTML = '';

    const main = el('div');
    main.appendChild(el('div', null,
      '<div style="padding:16px 16px 10px"><b style="font-size:20px">Add to store' +
      ' list</b><small style="display:block;color:var(--dim);font-size:14px;' +
      'margin-top:3px">Uncheck anything you already have</small></div>'));

    const skip = new Set(recipe.ingredients.filter(i => i.is_staple).map(i => i.id));
    const normal  = recipe.ingredients.filter(i => !i.is_staple);
    const staples = recipe.ingredients.filter(i => i.is_staple);

    const cta = el('button','btn','');
    const paintCta = () => cta.textContent =
      'Add ' + (recipe.ingredients.length - skip.size) + ' items to list';

    const ingRow = i => {
      const row = el('div','row');
      const off = () => skip.has(i.id);
      const box = el('div','bx' + (off() ? '' : ' on'), off() ? '' : '✓');
      const nm  = el('div','nm','<b style="font-weight:400">' + esc(i.raw_text) + '</b>');
      row.appendChild(box); row.appendChild(nm);
      const dress = () => {
        box.className = 'bx' + (off() ? '' : ' on');
        box.textContent = off() ? '' : '✓';
        nm.style.opacity = off() ? .35 : 1;
        nm.style.textDecoration = off() ? 'line-through' : 'none';
      };
      row.onclick = () => { off() ? skip.delete(i.id) : skip.add(i.id); dress(); paintCta(); };
      dress();
      return row;
    };

    normal.forEach(i => main.appendChild(ingRow(i)));

    if (staples.length){
      const names = staples.map(s => s.pantry_name || s.raw_text).join(', ');
      let open = false;
      const holder = el('div');
      const fold = el('div','fold', '');
      const dress = () => fold.innerHTML = (open ? '▾ ' : '▸ ') +
        esc(staples.length + ' staple' + (staples.length > 1 ? 's' : '') +
            ' skipped — ' + names);
      fold.onclick = () => {
        open = !open;
        holder.innerHTML = '';
        if (open) staples.forEach(i => holder.appendChild(ingRow(i)));
        dress(); measureHeader();
      };
      dress();
      main.appendChild(fold);
      main.appendChild(holder);
    }

    paintCta();
    cta.onclick = async () => {
      const r = await api('/list/add-recipe/' + recipe.id,
                          {method:'POST', body:{skip:[...skip]}});
      // On failure api() has already said so; stay put so the sheet is not lost.
      if (!r) return;
      STATE.list = r; STATE.version = r.version;
      resolve();
    };
    main.appendChild(cta);

    const cancel = el('button','btn quiet','Skip this one');
    cancel.onclick = () => resolve();
    main.appendChild(cancel);

    paint(main);
  });
}

async function openRecipe(id){
  const r = await api('/recipes/' + id);
  if (!r) { note('Could not open that recipe.'); return; }
  $('#title').textContent = r.name;
  $('#count').textContent = '';
  $('#hdextra').innerHTML = '';

  const main = el('div');
  const bits = recipeBits(r);
  if (bits) main.appendChild(el('div', null,
    '<div style="padding:12px 16px 0;color:var(--dim);font-size:15px">' +
    esc(bits) + '</div>'));
  // esc() would not stop a "javascript:" href — that scheme needs none of the
  // characters it escapes — so only ever link something that is plainly a URL.
  if (/^https?:\/\//i.test(r.source_url || '')) main.appendChild(el('div', null,
    '<div style="padding:10px 16px 2px"><a href="' + esc(r.source_url) +
    '" target="_blank" rel="noopener" style="color:var(--accent)">' +
    'open the original</a></div>'));

  main.appendChild(el('div','sec','Ingredients'));
  r.ingredients.forEach(i => main.appendChild(
    el('div','row','<div class="nm"><b style="font-weight:400">' +
       esc(i.raw_text) + '</b>' + (i.is_staple ?
       '<small>staple — usually in the house</small>' : '') + '</div>')));

  if (r.instructions && r.instructions.trim()){
    main.appendChild(el('div','sec','Method'));
    main.appendChild(el('div','prose', esc(r.instructions)));
  }

  const go = el('button','btn','Add to store list');
  go.onclick = () => runAddSheets([r.id]);
  main.appendChild(go);

  const ed = el('button','btn quiet','Edit');
  ed.onclick = () => openRecipeEditor(r);
  main.appendChild(ed);

  const back = el('button','btn quiet','Back to recipes');
  back.onclick = () => render();
  main.appendChild(back);

  paint(main);
}

function openRecipeEditor(r){
  $('#title').textContent = r ? 'Edit recipe' : 'New recipe';
  $('#count').textContent = '';
  $('#hdextra').innerHTML = '';

  const main = el('div');
  const field = (id, label, value, tag) => {
    main.appendChild(el('div','lbl', esc(label)));
    const wrap = el('div','pad');
    const node = document.createElement(tag || 'input');
    node.className = 'fld';
    node.id = id;
    if (tag === 'textarea') node.rows = 8;
    node.value = value == null ? '' : String(value);
    wrap.appendChild(node);
    main.appendChild(wrap);
    return node;
  };

  const name    = field('f_name',   'Name', r && r.name);
  const source  = field('f_source', 'Source (smitten kitchen, Grandma…)', r && r.source_name);
  const url     = field('f_url',    'Source URL', r && r.source_url);
  const serves  = field('f_serves', 'Serves', r && r.servings);
  const minutes = field('f_min',    'Minutes', r && r.time_minutes);
  const ings    = field('f_ings',   'Ingredients — one per line',
                        r ? r.ingredients.map(i => i.raw_text).join('\n') : '', 'textarea');
  const method  = field('f_method', 'Method', r && r.instructions, 'textarea');
  serves.inputMode = minutes.inputMode = 'numeric';

  const save = el('button','btn', r ? 'Save' : 'Create');
  save.onclick = async () => {
    if (!name.value.trim()) { note('Give it a name first.'); name.focus(); return; }
    const body = {
      name: name.value.trim(),
      source_name: source.value.trim() || null,
      source_url: url.value.trim() || null,
      servings: parseInt(serves.value, 10) || null,
      time_minutes: parseInt(minutes.value, 10) || null,
      instructions: method.value,
      ingredients: ings.value.split('\n').map(s => s.trim()).filter(Boolean),
    };
    const saved = await api(r ? '/recipes/' + r.id : '/recipes',
                            {method: r ? 'PUT' : 'POST', body});
    if (!saved) return;                       // api() already explained why
    STATE.recipes = (await api('/recipes'))?.recipes || STATE.recipes;
    STATE.pantry = [];                        // filing may have gained new rows
    TAB = 'recipes'; RECIPE_FILTER = '';
    openRecipe(saved.id);
  };
  main.appendChild(save);

  const cancel = el('button','btn quiet','Cancel');
  cancel.onclick = () => { TAB = 'recipes'; render(); };
  main.appendChild(cancel);

  paint(main);
}

// ---- pantry -----------------------------------------------------------------
// Rarely opened, load-bearing: filing here is what puts an item in the right
// aisle forever, and the staple flag is what keeps salt off the list.

let PANTRY_FILTER = '';
let PANTRY_EDIT = null;      // id of the item whose panel is open

function renderPantry(focused){
  $('#title').textContent = 'Pantry';
  $('#count').textContent = STATE.pantry.length + ' items';

  searchBox('psearch', 'Find an item…', PANTRY_FILTER,
            v => { PANTRY_FILTER = v; render(); }, focused);

  const q = PANTRY_FILTER.trim().toLowerCase();
  const shown = STATE.pantry.filter(p => !q || p.name.toLowerCase().includes(q));

  const main = el('div');
  if (!shown.length) main.appendChild(el('div','empty',
    STATE.pantry.length ? 'No matches.' :
    'Nothing here yet.<br>Ingredients file themselves as you add recipes.'));

  let lastSection = null;
  shown.forEach(p => {
    if (p.section_name !== lastSection){
      lastSection = p.section_name;
      main.appendChild(el('div','sec', esc(lastSection)));
    }
    const bits = [p.subsection_name || 'unfiled',
                  p.is_staple ? 'staple' : '',
                  p.buy_unit || '',
                  p.shaws_url ? 'Shaws ✓' : ''].filter(Boolean).join(' · ');
    const row = el('div','row');
    row.appendChild(el('div','nm',
      '<b>' + esc(p.name) + '</b><small>' + esc(bits) + '</small>'));
    row.appendChild(el('div','qty', PANTRY_EDIT === p.id ? '▾' : '›'));
    row.onclick = () => { PANTRY_EDIT = PANTRY_EDIT === p.id ? null : p.id; render(); };
    main.appendChild(row);
    if (PANTRY_EDIT === p.id) main.appendChild(pantryPanel(p));
  });

  paint(main);
}

// A real form, in place, under the row. It replaces a prompt()/confirm() chain
// from the plan: those are unusable one-handed and a blocking dialog also means
// nothing can drive this screen but a pair of hands.
function pantryPanel(p){
  const panel = el('div','panel');

  panel.appendChild(el('div','lbl','Where does it live in the store?'));
  const sel = document.createElement('select');
  sel.className = 'fld';
  sel.id = 'p_sub';
  const blank = document.createElement('option');
  blank.value = ''; blank.textContent = '— unfiled —';
  sel.appendChild(blank);
  // The sub-category list is whatever the database says today, not a copy of
  // seed.py: the layout is editable and a frontend copy would drift.
  STATE.sections.forEach(s => {
    const group = document.createElement('optgroup');
    group.label = s.name;
    (s.subsections || []).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      if (name === p.subsection_name) opt.selected = true;
      group.appendChild(opt);
    });
    sel.appendChild(group);
  });
  sel.value = p.subsection_name || '';
  const subWrap = el('div','pad'); subWrap.appendChild(sel);
  panel.appendChild(subWrap);

  let staple = !!p.is_staple;
  const box = el('div','bx' + (staple ? ' on' : ''), staple ? '✓' : '');
  const stapleRow = el('div','row');
  stapleRow.style.marginTop = '10px';
  stapleRow.appendChild(box);
  stapleRow.appendChild(el('div','nm',
    '<b>Always in the house</b><small>skipped by default when a recipe is added</small>'));
  stapleRow.onclick = () => {
    staple = !staple;
    box.className = 'bx' + (staple ? ' on' : '');
    box.textContent = staple ? '✓' : '';
  };
  panel.appendChild(stapleRow);

  const textField = (id, label, value, placeholder) => {
    panel.appendChild(el('div','lbl', esc(label)));
    const node = document.createElement('input');
    node.className = 'fld'; node.id = id;
    node.value = value || '';
    node.placeholder = placeholder || '';
    const wrap = el('div','pad'); wrap.appendChild(node);
    panel.appendChild(wrap);
    return node;
  };
  const buy   = textField('p_buy', 'What do we buy?', p.buy_unit, 'e.g. 1 gal');
  const shaws = textField('p_shaws', 'Shaws product link', p.shaws_url,
                          'https://…  (makes the pickup export automatic)');

  const save = el('button','btn','Save');
  save.onclick = async () => {
    const r = await api('/pantry/' + p.id, {method:'PATCH', body:{
      subsection: sel.value || null,
      is_staple: staple,
      buy_unit: buy.value.trim() || null,
      shaws_url: shaws.value.trim() || null,
    }});
    if (!r) return;
    STATE.pantry = (await api('/pantry'))?.items || STATE.pantry;
    PANTRY_EDIT = null;
    render();
  };
  panel.appendChild(save);

  const close = el('button','btn quiet','Cancel');
  close.onclick = () => { PANTRY_EDIT = null; render(); };
  panel.appendChild(close);

  return panel;
}

// ---- store list -------------------------------------------------------------
// Checked items leave the screen and sink into a per-section fold, so the list
// only ever shows what is still needed. Two ways back from a mistake: the undo
// bar for the last few seconds, the fold for anything older.

const OPEN_FOLDS = new Set();     // section names whose fold is expanded
let ADD_TEXT = '';                // survives the re-render a poll triggers

function renderList(focused){
  const d = STATE.list;
  $('#title').textContent = 'Store List';
  if (!d) { $('#main').innerHTML = '<div class="empty">Loading…</div>'; return; }

  const left = d.lines.filter(l => !l.checked).length;
  $('#count').textContent = left + ' left · ' + d.lines.length;

  // meal-plan strip: what these groceries are for
  if (d.meals.length){
    const strip = el('div','strip');
    d.meals.forEach(m => {
      const chip = el('span', null, esc(m.name) + ' ✕');
      chip.onclick = async () => {
        if (!confirm('Take ' + m.name + ' off the list?')) return;
        const r = await api('/list/remove-recipe/' + m.id, {method:'POST', body:{}});
        if (r) { STATE.list = r; STATE.version = r.version; }
        render();
      };
      strip.appendChild(chip);
    });
    $('#hdextra').appendChild(strip);
  }

  const main = el('div');

  // quick add — "we're out of trash bags", straight onto the list
  const add = el('input','search');
  add.id = 'addline';
  add.placeholder = 'Add anything…';
  add.value = ADD_TEXT;
  add.oninput = () => { ADD_TEXT = add.value; };
  add.onkeydown = async e => {
    if (e.key !== 'Enter' || !add.value.trim()) return;
    const name = add.value.trim();
    add.value = ''; ADD_TEXT = '';
    const r = await api('/list/add', {method:'POST', body:{name}});
    if (r) { STATE.list = r; STATE.version = r.version; }
    render();
  };
  $('#hdextra').appendChild(add);
  if (focused === 'addline'){ add.focus(); add.setSelectionRange(add.value.length, add.value.length); }

  let any = false;
  for (const section of d.sections){
    if (!section.lines.length) continue;          // never show an empty aisle
    any = true;
    main.appendChild(el('div','sec', esc(section.name)));

    const open = section.lines.filter(l => !l.checked);
    const done = section.lines.filter(l => l.checked);

    open.forEach(l => main.appendChild(lineRow(l)));

    if (done.length){
      const fold = el('div','fold', '✓ ' + done.length + ' in the cart');
      const holder = el('div');
      const paint = () => {
        const shown = OPEN_FOLDS.has(section.name);
        holder.innerHTML = '';
        if (shown) done.forEach(l => holder.appendChild(lineRow(l)));
      };
      fold.onclick = () => {
        if (OPEN_FOLDS.has(section.name)) OPEN_FOLDS.delete(section.name);
        else OPEN_FOLDS.add(section.name);
        paint(); measureHeader();
      };
      paint();
      main.appendChild(fold);
      main.appendChild(holder);
    }
  }

  if (!any) main.appendChild(el('div','empty',
    'Nothing on the list.<br>Add a recipe, or type something above.'));

  if (d.lines.some(l => l.checked)){
    const finish = el('button','btn', 'Finish trip');
    finish.onclick = async () => {
      clearUndo();                // the trip is over; those lines are gone
      const r = await api('/list/finish-trip', {method:'POST', body:{}});
      if (r) { STATE.list = r; STATE.version = r.version; }
      render();
    };
    main.appendChild(finish);
  }

  $('#main').innerHTML = '';
  $('#main').appendChild(main);
}

// /api/list serves every line twice — once in `lines`, once inside its section —
// and JSON hands us two separate objects, so a local flip has to touch both or
// the counter and the Finish trip button go stale for a render.
function markChecked(id, val){
  const d = STATE.list;
  if (!d) return;
  const hit = l => { if (l.id === id){ l.checked = val; l.checked_by = val ? who() : null; } };
  d.lines.forEach(hit);
  d.sections.forEach(s => s.lines.forEach(hit));
}

// One write path for every way a line gets checked or unchecked — swipe, the
// checkbox, and Undo. Returns whether the server agreed.
async function setChecked(l, want){
  markChecked(l.id, want);          // leave the screen now, not in 300ms
  render();
  const r = await api('/list/line/' + l.id + '/check',
                      {method:'POST', body:{checked: want}});
  if (r) { STATE.list = r; STATE.version = r.version; }
  else { markChecked(l.id, !want); clearUndo(); }   // the server refused
  render();
  return !!r;
}

// The 4-second poll rebuilds #main wholesale, so the bar hangs off <body> and
// keeps its own clock. Only the newest check is undoable: in a store you check
// things off in a run, and a mis-swipe is the one that just happened.
let UNDO_T = null;

function clearUndo(){
  clearTimeout(UNDO_T);
  const old = document.querySelector('.undo');
  if (old) old.remove();
  document.body.classList.remove('hasundo');
}

function undoBar(l){
  clearUndo();
  const bar = el('div','undo');
  bar.appendChild(el('span','txt', esc(l.name) + ' — in the cart'));
  const b = el('button', null, 'Undo');
  b.onclick = () => { clearUndo(); setChecked(l, false); };
  bar.appendChild(b);
  document.body.appendChild(bar);
  document.body.classList.add('hasundo');
  UNDO_T = setTimeout(clearUndo, 8000);
}

const SWIPE_MIN = 64;    // px — floor for the commit threshold
const AXIS_LOCK = 10;    // px of travel before scroll-or-swipe is decided

// Wrap a row so a horizontal drag in `dir` (+1 right, -1 left) commits it. The
// first AXIS_LOCK px decide: vertical wins and we bow out for the rest of the
// gesture so the page scrolls untouched.
function swipeWrap(row, dir, label, commit){
  const wrap = el('div','swipe');
  const act = el('div', 'swact' + (dir > 0 ? '' : ' rev'), label);
  wrap.appendChild(act);
  wrap.appendChild(row);

  let id = null, x0 = 0, y0 = 0, dx = 0, live = false, dead = false;
  const trip = () => Math.max(SWIPE_MIN, wrap.offsetWidth * .35);
  const draw = () => {
    row.style.transform = dx ? 'translateX(' + dx + 'px)' : '';
    act.classList.toggle('armed', Math.abs(dx) >= trip());
  };
  const rest = () => { dx = 0; row.style.transition = ''; draw(); };

  row.onpointerdown = e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    id = e.pointerId; x0 = e.clientX; y0 = e.clientY;
    dx = 0; live = false; dead = false;
  };

  row.onpointermove = e => {
    if (e.pointerId !== id || dead) return;
    const ax = e.clientX - x0, ay = e.clientY - y0;
    if (!live){
      if (Math.abs(ax) < AXIS_LOCK && Math.abs(ay) < AXIS_LOCK) return;
      if (Math.abs(ay) >= Math.abs(ax)) { dead = true; return; }   // it's a scroll
      live = true;
      row.style.transition = 'none';
      try { row.setPointerCapture(id); } catch(_){}
    }
    // only the direction that changes this row's state tracks the finger
    dx = dir > 0 ? Math.min(Math.max(0, ax), wrap.offsetWidth)
                 : Math.max(Math.min(0, ax), -wrap.offsetWidth);
    draw();
  };

  const up = e => {
    if (e.pointerId !== id) return;
    id = null;
    if (live){
      const go = Math.abs(dx) >= trip();
      live = false; rest();
      if (go) commit();
      return;
    }
    if (dead) { dead = false; return; }
    // a tap: never commits. There is no small target to hit either — a nudge
    // that shows which way the row wants to go is all a tap can do.
    row.style.transition = '';
    dx = dir * 8; draw();
    setTimeout(rest, 150);
  };
  row.onpointerup = up;
  row.onpointercancel = e => { if (e.pointerId === id){ id = null; live = false; dead = false; rest(); } };

  return wrap;
}

// No checkbox: a 26px target next to a name you are reading in a moving cart is
// the fat-finger problem in miniature, and it said nothing a row's position and
// strikethrough don't already say. The swipe is the only way to check a line off.
function lineRow(l){
  const row = el('div','row');

  const sub = [l.sources.join(' · '),
               l.buy_unit ? '→ ' + l.buy_unit : '',
               l.checked && l.checked_by ? 'got by ' + l.checked_by : '']
                .filter(Boolean).join(' · ');
  const nm = el('div','nm',
    '<b>' + esc(l.name) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : ''));
  row.appendChild(nm);

  if (l.qty_display) row.appendChild(el('div','qty', esc(l.qty_display)));

  if (l.checked) { nm.style.opacity = .4; nm.style.textDecoration = 'line-through'; }

  // swipe right to put it in the cart, left to take it back out
  return l.checked
    ? swipeWrap(row, -1, '↩', () => { clearUndo(); setChecked(l, false); })
    : swipeWrap(row, +1, '✓', async () => { if (await setChecked(l, true)) undoBar(l); });
}

// ---- loading and sync -------------------------------------------------------

async function refresh(){
  if (TAB === 'recipes' && !STATE.recipes.length)
    STATE.recipes = (await api('/recipes'))?.recipes || [];
  if (TAB === 'pantry'){
    STATE.pantry = (await api('/pantry'))?.items || [];
    // the store layout, for the filing picker — seeded once, so fetch once
    if (!STATE.sections.length)
      STATE.sections = (await api('/sections'))?.sections || [];
  }
  if (!STATE.list) STATE.list = await api('/list');
  if (STATE.list) STATE.version = STATE.list.version;
  render();
}

// Cross-phone sync: cheap version check, full payload only when something moved.
async function poll(){
  if (TAB !== 'list') return;
  const r = await api('/list/poll?since=' + STATE.version);
  if (r && r.changed) { STATE.list = r; STATE.version = r.version; render(); }
}
setInterval(poll, 4000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) poll(); });

refresh();
</script>
