<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12100c">
<title>Eg-Lana</title>
<style>
  /* Same bones as recipes.html so this reads as the same site, with a warm
     ochre accent instead of blue -- the two pages are never confused at a
     glance, and this one is stone and torchlight rather than a kitchen. */
  :root{
    --bg:#12100c; --panel:#1a1712; --panel2:#221e17; --line:rgba(255,255,255,.08);
    --txt:#ece7dd; --dim:rgba(236,231,221,.45); --accent:#d9a441; --go:#3d8b5f;
    --raw:#8a8378; --understood:#d9a441; --used:#4a4640;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:400 15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden}

  header{flex:none;display:flex;align-items:center;gap:14px;padding:9px 16px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;font-weight:600;letter-spacing:.02em;margin:0;flex:none}
  header h1 span{color:var(--accent)}
  .tabs{display:flex;gap:2px;flex:none}
  .tabs button{background:none;border:0;color:var(--dim);font:inherit;padding:5px 12px;
    border-radius:7px;cursor:pointer}
  .tabs button.on{background:var(--panel2);color:var(--txt)}
  .search{flex:1;max-width:420px;margin-left:auto;padding:7px 11px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font:inherit}
  .search:focus{outline:none;border-color:var(--accent)}
  .who{flex:none;color:var(--dim);font-size:13px}

  main{flex:1;display:flex;min-height:0}
  .rail{flex:none;width:190px;overflow-y:auto;padding:10px 0 30px;
    border-right:1px solid var(--line);background:var(--panel)}
  .rail h3{font-size:11px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--dim);margin:14px 14px 6px;font-weight:600}
  .rail h3:first-child{margin-top:2px}
  .rail button{display:flex;width:100%;gap:8px;align-items:baseline;background:none;
    border:0;color:var(--dim);font:inherit;text-align:left;padding:4px 14px;
    cursor:pointer;border-left:2px solid transparent}
  .rail button:hover{color:var(--txt)}
  .rail button.on{color:var(--txt);border-left-color:var(--accent);
    background:rgba(217,164,65,.07)}
  .rail button b{font-weight:400;flex:1;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .rail button i{font-style:normal;font-size:12px;color:var(--dim);flex:none}

  .list{flex:none;width:330px;overflow-y:auto;border-right:1px solid var(--line)}
  .list .row{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);
    cursor:pointer}
  .list .row:hover{background:var(--panel)}
  .list .row.on{background:var(--panel2)}
  .list .row b{display:block;font-weight:500;font-size:14px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .row small{display:block;color:var(--dim);font-size:12px;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .empty{padding:26px 16px;color:var(--dim);font-size:13px}

  .pill{display:inline-block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    padding:1px 6px;border-radius:20px;vertical-align:1px;margin-right:6px}
  .pill.raw{background:var(--raw);color:#12100c}
  .pill.understood{background:var(--understood);color:#12100c}
  .pill.used{background:var(--used);color:var(--dim)}
  .pill.open{background:var(--understood);color:#12100c}
  .pill.solved{background:var(--used);color:var(--dim)}
  .kindtag{display:inline-block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--dim);margin-right:6px;vertical-align:1px}

  .detail{flex:1;overflow-y:auto;padding:20px 26px 60px;min-width:0}
  .titlefld{font-size:20px;font-weight:600;margin:0 0 4px;padding:6px 9px}
  .detail .empty{color:var(--dim);margin-top:40px}
  .detail .where{color:var(--dim);font-size:13px;margin-bottom:16px}
  .detail .quote{background:var(--panel);border-left:2px solid var(--accent);
    padding:11px 14px;margin:0 0 16px;white-space:pre-wrap;font-size:15px;
    line-height:1.55}
  .detail label{display:block;font-size:11px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--dim);margin:16px 0 5px;font-weight:600}
  .fld{display:block;width:100%;padding:9px 11px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font:inherit}
  .fld:focus{outline:none;border-color:var(--accent)}
  textarea.fld{line-height:1.5;resize:vertical;min-height:70px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font:inherit;padding:7px 13px;border-radius:8px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.go{background:var(--accent);border-color:var(--accent);color:#12100c;
    font-weight:500}
  .btn.danger:hover{border-color:#b4483c;color:#e0796d}
  .btns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;
    align-items:flex-start;justify-content:center;padding-top:9vh;z-index:20}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(560px,92vw);padding:18px 20px 20px;max-height:80vh;overflow-y:auto}
  .modal h3{margin:0 0 14px;font-size:16px;font-weight:600}
  .two{display:flex;gap:10px}
  .two > *{flex:1;min-width:0}

  .keys{position:fixed;bottom:0;left:0;right:0;padding:5px 16px;font-size:11px;
    color:var(--dim);background:var(--panel);border-top:1px solid var(--line)}
  .keys b{color:var(--txt);font-weight:500}

  .prow{display:flex;align-items:baseline;gap:10px}
  .prow .pnote{flex:0 0 200px;margin-left:auto}
  .prow .pdel{padding:2px 9px;min-width:0}

  .toast{position:fixed;left:16px;bottom:16px;z-index:30;max-width:420px;
    background:#3a2822;border:1px solid #7a5230;color:var(--txt);
    padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.4)}

  /* The mobile-only chrome: a back bar above the detail pane, a button that
     opens the filter rail as its own screen, and a + for capture. All three
     are display:none on desktop, where the three panes are visible at once
     and the keyboard does this job. */
  .backbar, .filterbtn, .fab{display:none}

  /* ------------------------------------------------------------------
     Phone / narrow tablet. The desktop layout is three panes side by
     side; there is no room for that on a handset, so the same markup
     becomes one pane at a time and `main[data-pane]` says which. The
     panes are hidden rather than unmounted so scroll position and focus
     survive a trip into the detail view and back.
     ------------------------------------------------------------------ */
  @media (max-width: 820px) {
    body{overflow:auto}

    /* Two rows: identity + tabs, then the search box full width. */
    header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;
      position:sticky;top:0;z-index:10}
    header h1{font-size:15px}
    .tabs{flex:1;justify-content:flex-end}
    .tabs button{padding:8px 12px}
    /* 16px keeps iOS from zooming the page when the field takes focus --
       same reason recipes.html pins its inputs to 16px. */
    .search{order:3;flex-basis:100%;max-width:none;margin-left:0;font-size:16px;
      padding:10px 12px}
    .who{order:4;flex-basis:100%;font-size:12px}

    main{display:block;min-height:0}
    .rail, .list, .detail{width:auto;border-right:0}
    .rail{max-height:none;padding-bottom:40px}

    main[data-pane="list"]   .rail   {display:none !important}
    main[data-pane="list"]   .detail {display:none !important}
    main[data-pane="detail"] .rail   {display:none !important}
    main[data-pane="detail"] .list   {display:none !important}
    main[data-pane="rail"]   .list   {display:none !important}
    main[data-pane="rail"]   .detail {display:none !important}

    /* Thumb-sized rows. The desktop 9px padding is a mouse target. */
    .list .row{padding:13px 14px;min-height:56px}
    .rail button{padding:12px 16px;min-height:48px;align-items:center}
    .detail{padding:14px 16px calc(90px + env(safe-area-inset-bottom))}

    .backbar{display:flex;align-items:center;gap:10px;margin:-14px -16px 12px;
      padding:10px 14px;background:var(--panel);
      border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    .backbar button{background:none;border:0;color:var(--accent);font:inherit;
      padding:6px 4px;cursor:pointer;font-size:15px}

    .filterbtn{display:flex;width:100%;align-items:center;gap:8px;
      background:var(--panel);border:0;border-bottom:1px solid var(--line);
      color:var(--txt);font:inherit;padding:12px 14px;cursor:pointer;
      text-align:left;min-height:48px}
    .filterbtn i{font-style:normal;color:var(--dim);font-size:13px}

    /* Capture is keyboard-only on desktop (n / N). On a phone there is no
       keyboard, so the primary action needs to be reachable by thumb. */
    .fab{display:flex;align-items:center;justify-content:center;
      position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));
      width:56px;height:56px;border-radius:28px;z-index:15;
      background:var(--accent);color:#12100c;border:0;font-size:30px;
      line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer}

    .fld, .search, input, select, textarea{font-size:16px}
    .btn{padding:11px 15px;min-height:44px}
    .modal{padding-top:0;align-items:stretch}
    .modal .box{width:100%;max-height:100%;border-radius:0;
      padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
    .two{flex-direction:column}
    /* The note is a full-width second line rather than a 200px column
       squeezed against the right edge of a 390px screen. */
    .prow{flex-wrap:wrap;align-items:center;padding:12px 14px}
    .prow .pnote{flex:1 0 100%;margin-left:0;order:3}
    .prow > span{flex:1;min-width:0}
    .prow .pdel{min-height:36px;padding:4px 12px}
    .prow .notebtn{order:2;min-height:36px;padding:4px 12px;font-size:13px;
      color:var(--dim)}
    .prow input[type=checkbox]{width:22px;height:22px;flex:none}

    .keys{display:none}
    .toast{left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));
      max-width:none}
  }
</style>
</head>
<body>
<header>
  <h1>Eg-<span>Lana</span></h1>
  <div class="tabs">
    <button data-tab="clues" class="on">Clues</button>
    <button data-tab="threads">Threads</button>
    <button data-tab="progress">Progress</button>
  </div>
  <input class="search" placeholder="Search everything…  /">
  <div class="who"></div>
</header>

<main data-pane="list">
  <div class="rail"></div>
  <div class="list"></div>
  <div class="detail"><div class="empty">Nothing selected.</div></div>
</main>

<button class="fab" aria-label="New">+</button>

<div class="keys">
  <b>n</b> new clue · <b>N</b> new thread · <b>/</b> search ·
  <b>j/k</b> move · <b>l</b> link · <b>1–3</b> tabs · <b>esc</b> close
</div>

<datalist id="roomlist"></datalist>

<script>
// ---------------------------------------------------------------------------
// State and plumbing
// ---------------------------------------------------------------------------
const S = {
  tab: 'clues',
  areas: [], areaById: {},
  clues: [], threads: [], checklist: [],
  counts: {},
  filterArea: null, filterState: null, filterSource: null,
  selected: null,          // id within the active tab (or within the search results)
  selectedKind: null,      // 'clue' | 'thread' — which list `selected` refers to
  detail: null,            // the loaded thread detail, when a thread is selected
  query: '',
  canEdit: false,
  // Which single pane a phone is showing: 'list' | 'detail' | 'rail'.
  // Ignored entirely on desktop, where all three are on screen at once.
  pane: 'list',
};

// Kept as a live query rather than a boolean captured at load, so rotating a
// phone or dragging a desktop window narrow re-answers it instead of leaving
// the page in a layout the CSS is no longer using.
const NARROW = window.matchMedia('(max-width: 820px)');
const isNarrow = () => NARROW.matches;

const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};

// Any non-403 error response still carries a body — {"error": "..."} — so a
// 400/404/409/500 gets surfaced as a toast and a clean `null` return, rather
// than callers destructuring a rejected response and throwing mid-render (a
// dropped WHERE, a duplicate checklist row, a stale id all used to freeze the
// page this way instead of just failing loudly).
async function api(path, opts) {
  let r, data;
  try {
    r = await fetch('/lamulana/api/' + path, {
      headers: {'Content-Type': 'application/json'},
      ...opts,
    });
    data = await r.json();
  } catch (e) {
    toast('No connection — that did not go through.');
    return null;
  }
  if (r.status === 403) { alertOnce(); return null; }
  if (!r.ok) {
    toast((data && data.error) || ('That did not work (' + r.status + ').'));
    return null;
  }
  return data;
}

let toastTimer = null;
function toast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = el('div', 'toast', msg);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 4500);
}

// For the rare case a session goes read-only *after* load (it expired while
// the page was open): the buttons this session was handed at boot are still
// in the DOM, so a click still needs to say something. Boot-time read-only
// is handled directly in boot() below instead — there is no button to
// silently fail, because none is ever rendered.
let warned = false;
function alertOnce() {
  if (warned) return;
  warned = true;
  $('.who').textContent = 'read-only — log in on the soundboard to edit';
}

async function boot() {
  const data = await api('bootstrap');
  if (!data) return;  // api() already told the user why
  S.areas = data.areas;
  S.areaById = Object.fromEntries(data.areas.map(a => [a.id, a.name]));
  S.checklist = data.checklist;
  S.counts = data.counts;
  const me = await (await fetch('/api/me')).json();
  S.canEdit = !!me.can_edit;
  if (!S.canEdit) {
    // Set directly, not via alertOnce(): alertOnce's job is to react to a
    // 403 that arrives *after* load, and burning its one-shot `warned` flag
    // here would make every later 403 (Save, Delete, a checklist toggle...)
    // hit the early return and do nothing. Read-only is already known at
    // this point, and the write controls below are never rendered for it,
    // so nothing will call alertOnce() until a session that started
    // editable stops being one.
    $('.who').textContent = 'read-only — log in on the soundboard to edit';
    $('.keys').style.display = 'none';
  }
  const rooms = await api('rooms');
  $('#roomlist').innerHTML = '';
  (rooms ? rooms.rooms : []).forEach(r => {
    const o = document.createElement('option'); o.value = r;
    $('#roomlist').appendChild(o);
  });
  await refresh();
}

async function refresh() {
  // A live search overrides tab-scoped filtering entirely: /api/search has
  // no area/state/source params, and it returns both kinds regardless of
  // which tab is active, so a hit shows up no matter where you searched from.
  if (S.query) {
    const data = await api('search?q=' + encodeURIComponent(S.query));
    if (data) { S.clues = data.clues; S.threads = data.threads; }
  } else if (S.tab === 'clues') {
    const p = new URLSearchParams();
    if (S.filterArea) p.set('area', S.filterArea);
    if (S.filterState) p.set('state', S.filterState);
    if (S.filterSource) p.set('source', S.filterSource);
    const data = await api('clues?' + p);
    if (data) S.clues = data.clues;
  } else if (S.tab === 'threads') {
    const p = new URLSearchParams();
    if (S.filterArea) p.set('area', S.filterArea);
    if (S.filterState) p.set('state', S.filterState);
    const data = await api('threads?' + p);
    if (data) S.threads = data.threads;
  } else {
    const data = await api('checklist');
    if (data) S.checklist = data.groups;
  }
  // Deliberately still a second request every refresh, now that the rail
  // actually renders these counts (it didn't, before this pass) and they
  // have to reflect whatever write just happened — a state change, a new
  // clue, a solved thread. bootstrap is a handful of small GROUP BY queries
  // against a few hundred rows at most, so the redundant areas/checklist
  // payload that rides along is not worth a second endpoint to avoid.
  const boot = await api('bootstrap');
  if (boot) S.counts = boot.counts;
  render();
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function render() {
  document.querySelectorAll('.tabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === S.tab));
  // Progress has no list or detail of its own — it draws into the detail
  // pane — so on a phone it must always be the visible one.
  const pane = (S.tab === 'progress' && !S.query) ? 'detail' : S.pane;
  $('main').dataset.pane = pane;
  renderRail();
  renderList();
  renderDetail();
  renderFab();
}

// The + button stands in for the n / N keys, which a phone doesn't have.
// Hidden on Progress (that tab has its own per-group "add a row"), and for
// a reader with no editing session, who has nothing to add.
function renderFab() {
  const fab = $('.fab');
  const show = S.canEdit && S.tab !== 'progress' && !S.query
    && ($('main').dataset.pane === 'list');
  fab.style.display = show ? '' : 'none';
  fab.setAttribute('aria-label', S.tab === 'threads' ? 'New thread' : 'New clue');
  fab.onclick = () => (S.tab === 'threads' ? newThread() : newClue());
}

// On a phone the detail pane is a whole screen, so it needs a way back to
// the list it came from. On desktop both are already visible and this is
// display:none.
function backBar(label) {
  const bar = el('div', 'backbar');
  const b = el('button', null, '‹ ' + label);
  b.onclick = () => { S.pane = 'list'; render(); };
  bar.appendChild(b);
  return bar;
}

// The rail filters the *active tab's* list, which a live search overrides
// (see refresh()) — filtering on top of a search result the rail's own
// area/state buttons don't apply to would be misleading, so it hides
// whenever a query is set, the same way it already hides on Progress.
function renderRail() {
  const rail = $('.rail');
  rail.innerHTML = '';
  const hide = S.tab === 'progress' || !!S.query;
  rail.style.display = hide ? 'none' : '';
  if (hide) return;

  // On a phone the rail is its own screen, reached from the list and
  // dismissed by choosing something; picking a filter and being left staring
  // at the rail would make you tap twice for every filter change.
  const pick = fn => () => { fn(); if (isNarrow()) S.pane = 'list'; refresh(); };

  if (isNarrow()) {
    const done = el('button', 'filterbtn railback');
    done.appendChild(el('span', null, '‹ Back to list'));
    done.onclick = () => { S.pane = 'list'; render(); };
    rail.appendChild(done);
  }

  const stateCounts = S.tab === 'clues' ? S.counts.clue_state : S.counts.thread_state;
  const areaCounts = S.tab === 'clues' ? S.counts.clue_area : S.counts.thread_area;
  const total = Object.values(stateCounts || {}).reduce((a, b) => a + b, 0);

  const states = S.tab === 'clues'
    ? [['raw', 'Raw'], ['understood', 'Understood'], ['used', 'Used']]
    : [['open', 'Open'], ['solved', 'Solved']];

  rail.appendChild(el('h3', null, 'State'));
  rail.appendChild(railButton('All', total, S.filterState === null,
    pick(() => { S.filterState = null; S.selected = null; })));
  states.forEach(([key, label]) => {
    rail.appendChild(railButton(label, (stateCounts && stateCounts[key]) || 0,
      S.filterState === key,
      pick(() => { S.filterState = key; S.selected = null; })));
  });

  rail.appendChild(el('h3', null, 'Area'));
  rail.appendChild(railButton('Everywhere', total, S.filterArea === null,
    pick(() => { S.filterArea = null; S.selected = null; })));
  S.areas.forEach(a => {
    rail.appendChild(railButton(a.name, (areaCounts && areaCounts[a.id]) || 0,
      S.filterArea === a.id,
      pick(() => { S.filterArea = a.id; S.selected = null; })));
  });

  // Source is a clue-only concept (see CLUE_SOURCES in lamulana/api.py) —
  // there is nothing to filter on the Threads tab. api_clues has always
  // accepted ?source=; nothing in the page offered it until now.
  if (S.tab === 'clues') {
    rail.appendChild(el('h3', null, 'Source'));
    rail.appendChild(railButton('Any', null, S.filterSource === null,
      pick(() => { S.filterSource = null; S.selected = null; })));
    [['tablet', 'Tablet'], ['npc', 'NPC'], ['mail', 'Mail'], ['other', 'Other']]
      .forEach(([v, label]) => {
        rail.appendChild(railButton(label, null, S.filterSource === v,
          pick(() => { S.filterSource = v; S.selected = null; })));
      });
  }
}

function railButton(label, count, on, onclick) {
  const b = el('button', on ? 'on' : '');
  b.appendChild(el('b', null, label));
  if (count != null) b.appendChild(el('i', null, String(count)));
  b.onclick = onclick;
  return b;
}

// The rows currently on screen, tagged with which kind each one is — the one
// place that answers "what's visible" for both renderList and the j/k
// keyboard nav, so the two can never disagree about order or contents.
// Outside a search this is just the active tab's own list; during a search
// it's clues and threads concatenated, regardless of tab (see refresh()).
function visibleRows() {
  if (S.query) {
    return [
      ...S.clues.map(row => ({id: row.id, kind: 'clue', row})),
      ...S.threads.map(row => ({id: row.id, kind: 'thread', row})),
    ];
  }
  if (S.tab === 'clues') return S.clues.map(row => ({id: row.id, kind: 'clue', row}));
  if (S.tab === 'threads') return S.threads.map(row => ({id: row.id, kind: 'thread', row}));
  return [];
}

function renderList() {
  const list = $('.list');
  list.innerHTML = '';
  const show = S.tab !== 'progress' || !!S.query;
  list.style.display = show ? '' : 'none';
  if (!show) return;

  // On a phone the rail is a separate screen, so the list needs a way in
  // and a readout of what is currently filtering it — otherwise an active
  // filter is invisible and an empty list looks like lost data.
  if (isNarrow() && !S.query && S.tab !== 'progress') {
    const active = [];
    if (S.filterState) active.push(S.filterState);
    if (S.filterArea) active.push(S.areaById[S.filterArea]);
    if (S.filterSource) active.push(S.filterSource);
    const fb = el('button', 'filterbtn listfilter');
    fb.appendChild(el('span', null, 'Filter'));
    fb.appendChild(el('i', null, active.length ? active.join(' · ') : 'everything'));
    fb.onclick = () => { S.pane = 'rail'; render(); };
    list.appendChild(fb);
  }

  const rows = visibleRows();
  if (!rows.length) {
    list.appendChild(el('div', 'empty',
      S.query ? 'Nothing matches.' : 'Nothing here yet.'));
    return;
  }
  rows.forEach(({id, kind, row: r}) => {
    const row = el('div', 'row' +
      (S.selected === id && S.selectedKind === kind ? ' on' : ''));
    const title = el('b');
    title.appendChild(el('span', 'pill ' + r.state, r.state));
    // Only a live search mixes both kinds in one list; outside of it the
    // active tab already says which kind you're looking at.
    if (S.query) title.appendChild(el('span', 'kindtag', kind));
    title.appendChild(document.createTextNode(r.title));
    row.appendChild(title);
    const bits = [];
    if (r.area) bits.push(r.area + (r.room ? ' ' + r.room : ''));
    if (kind === 'clue' && r.threads && r.threads.length) bits.push(r.threads.length + ' linked');
    if (kind === 'thread' && r.clue_count) bits.push(r.clue_count + ' clues');
    row.appendChild(el('small', null, bits.join(' · ')));
    row.onclick = () => select(id, kind);
    list.appendChild(row);
  });
}

async function select(id, kind) {
  kind = kind || (S.tab === 'threads' ? 'thread' : 'clue');
  S.selected = id;
  S.selectedKind = kind;
  // Picking a row on a phone means "go read it"; on desktop the detail pane
  // is already on screen beside the list and nothing should move.
  if (isNarrow()) S.pane = 'detail';
  if (kind === 'thread') {
    const data = await api('threads/' + id);
    S.detail = data ? data.thread : null;
  } else {
    S.detail = null;
  }
  render();
}

function renderDetail() {
  const d = $('.detail');
  d.innerHTML = '';
  if (S.tab === 'progress' && !S.query) { renderProgress(d); return; }
  // Progress is exempt above — it *is* the whole screen on a phone and has
  // no list behind it to go back to.
  if (isNarrow() && S.pane === 'detail') {
    d.appendChild(backBar(S.query ? 'Results'
      : (S.tab === 'threads' ? 'Threads' : 'Clues')));
  }
  if (!S.selected) {
    d.appendChild(el('div', 'empty', S.query
      ? 'Select a result.'
      : (S.tab === 'clues'
          ? 'Select a clue, or press n to record one.'
          : 'Select a thread, or press N to open one.')));
    return;
  }
  if (S.selectedKind === 'thread') renderThreadDetail(d);
  else renderClueDetail(d);
}

function renderClueDetail(d) {
  const c = S.clues.find(x => x.id === S.selected);
  if (!c) { d.appendChild(el('div', 'empty', 'Gone.')); return; }
  const editable = S.canEdit;

  // Title, body, room, area and source used to be set once at capture and
  // never again — a mistyped tablet transcription or a clue filed under the
  // wrong area had no way back short of delete-and-retype. PATCH has always
  // taken all five; they just weren't reachable from here.
  const title = el('input', 'fld titlefld');
  title.value = c.title;
  title.disabled = !editable;
  d.appendChild(title);

  d.appendChild(el('label', null, 'Where'));
  const two = el('div', 'two');
  const area = el('select', 'fld');
  const blankArea = area.appendChild(el('option', null, '— area —'));
  blankArea.value = '';
  S.areas.forEach(a => {
    const o = el('option', null, a.name); o.value = a.id;
    if (c.area_id === a.id) o.selected = true;
    area.appendChild(o);
  });
  area.disabled = !editable;
  const room = el('input', 'fld');
  room.placeholder = 'Room (E-3)';
  room.value = c.room || '';
  room.setAttribute('list', 'roomlist');
  room.disabled = !editable;
  two.append(area, room);
  d.appendChild(two);

  d.appendChild(el('label', null, 'Source'));
  const source = el('select', 'fld');
  [['tablet', 'Tablet'], ['npc', 'NPC'], ['mail', 'Mail'],
   ['other', 'Other']].forEach(([v, label]) => {
    const o = el('option', null, label); o.value = v;
    if (c.source === v) o.selected = true;
    source.appendChild(o);
  });
  source.disabled = !editable;
  d.appendChild(source);

  d.appendChild(el('label', null, 'Body — the text, as the game gave it'));
  const body = el('textarea', 'fld');
  body.value = c.body || '';
  body.disabled = !editable;
  d.appendChild(body);

  d.appendChild(el('label', null, 'What I think it means'));
  const interp = el('textarea', 'fld');
  interp.value = c.interpretation || '';
  interp.placeholder = 'Nothing yet.';
  interp.disabled = !editable;
  d.appendChild(interp);

  d.appendChild(el('label', null, 'State'));
  const state = el('select', 'fld');
  [['raw', 'Raw — copied it down, no idea'],
   ['understood', "Understood — know what it means, can't act yet"],
   ['used', 'Used — spent']].forEach(([v, label]) => {
    const o = el('option', null, label); o.value = v;
    if (c.state === v) o.selected = true;
    state.appendChild(o);
  });
  state.disabled = !editable;
  d.appendChild(state);

  if (c.threads.length) {
    d.appendChild(el('label', null, 'Feeds'));
    c.threads.forEach(t => {
      const row = el('div', 'row');
      row.style.cursor = 'pointer';
      row.appendChild(el('span', 'pill ' + t.state, t.state));
      row.appendChild(document.createTextNode(t.title));
      row.onclick = () => { S.tab = 'threads'; S.filterState = null; S.query = '';
        $('.search').value = ''; refresh().then(() => select(t.id, 'thread')); };
      d.appendChild(row);
    });
  }

  // Read-only sessions get none of this: a Save button that silently does
  // nothing on click is worse than no button at all.
  if (!editable) return;

  const btns = el('div', 'btns');
  const save = el('button', 'btn go', 'Save');
  save.onclick = async () => {
    const res = await api('clues/' + c.id, {method: 'PATCH', body: JSON.stringify({
      title: title.value, body: body.value, room: room.value,
      area_id: area.value ? +area.value : null, source: source.value,
      interpretation: interp.value, state: state.value})});
    if (res) refresh();
  };
  const link = el('button', 'btn', 'Link to a thread');
  link.onclick = () => linkPicker(c.id);
  const del = el('button', 'btn danger', 'Delete');
  del.onclick = async () => {
    const res = await api('clues/' + c.id, {method: 'DELETE'});
    if (res) { S.selected = null; refresh(); }
  };
  btns.append(save, link, del);
  d.appendChild(btns);
}

// ---------------------------------------------------------------------------
// Modals
// ---------------------------------------------------------------------------
function modal(title, build) {
  const back = el('div', 'modal');
  const box = el('div', 'box');
  box.appendChild(el('h3', null, title));
  back.appendChild(box);
  back.onclick = e => { if (e.target === back) back.remove(); };
  document.body.appendChild(back);
  build(box, () => back.remove());
  const first = box.querySelector('input, textarea, select');
  if (first) first.focus();
  return back;
}

const LAST_AREA = 'lamulana_last_area';

function newClue() {
  if (!S.canEdit) return alertOnce();
  modal('Record a clue', (box, close) => {
    const two = el('div', 'two');
    const area = el('select', 'fld');
    area.appendChild(el('option', null, '— area —')).value = '';
    S.areas.forEach(a => {
      const o = el('option', null, a.name); o.value = a.id;
      if (String(a.id) === localStorage.getItem(LAST_AREA)) o.selected = true;
      area.appendChild(o);
    });
    const room = el('input', 'fld');
    room.placeholder = 'Room (E-3)';
    room.setAttribute('list', 'roomlist');
    two.append(area, room);
    box.appendChild(two);

    const title = el('input', 'fld');
    title.placeholder = 'Title — how you\'ll recognise it';
    title.style.marginTop = '10px';
    box.appendChild(title);

    const body = el('textarea', 'fld');
    body.placeholder = 'The text, as the game gave it';
    body.style.marginTop = '10px';
    body.style.minHeight = '130px';
    box.appendChild(body);

    const source = el('select', 'fld');
    [['tablet', 'Tablet'], ['npc', 'NPC'], ['mail', 'Mail'],
     ['other', 'Other']].forEach(([v, label]) => {
      const o = el('option', null, label); o.value = v; source.appendChild(o);
    });
    source.style.marginTop = '10px';
    box.appendChild(source);

    const btns = el('div', 'btns');
    const save = el('button', 'btn go', 'Save');
    save.onclick = async () => {
      if (!title.value.trim()) return title.focus();
      if (area.value) localStorage.setItem(LAST_AREA, area.value);
      const res = await api('clues', {method: 'POST', body: JSON.stringify({
        title: title.value, body: body.value, room: room.value,
        source: source.value, area_id: area.value ? +area.value : null})});
      close();
      // Land on the new clue: reset filters/search first, since a stale
      // filter (or a leftover search term) could hide the very row we're
      // about to select, leaving the detail pane reporting "Gone."
      S.tab = 'clues'; S.filterState = null; S.filterArea = null;
      S.query = ''; $('.search').value = '';
      await refresh();
      if (res && res.clue) select(res.clue.id, 'clue');
    };
    const cancel = el('button', 'btn', 'Cancel');
    cancel.onclick = close;
    btns.append(save, cancel);
    box.appendChild(btns);
    title.focus();
  });
}

function newThread() {
  if (!S.canEdit) return alertOnce();
  modal('Open a thread', (box, close) => {
    const area = el('select', 'fld');
    area.appendChild(el('option', null, '— area —')).value = '';
    S.areas.forEach(a => {
      const o = el('option', null, a.name); o.value = a.id;
      if (String(a.id) === localStorage.getItem(LAST_AREA)) o.selected = true;
      area.appendChild(o);
    });
    box.appendChild(area);

    const title = el('input', 'fld');
    title.placeholder = "What's blocking you";
    title.style.marginTop = '10px';
    box.appendChild(title);

    const body = el('textarea', 'fld');
    body.placeholder = 'What you have tried, what you suspect you need';
    body.style.marginTop = '10px';
    box.appendChild(body);

    const btns = el('div', 'btns');
    const save = el('button', 'btn go', 'Open it');
    save.onclick = async () => {
      if (!title.value.trim()) return title.focus();
      if (area.value) localStorage.setItem(LAST_AREA, area.value);
      const res = await api('threads', {method: 'POST', body: JSON.stringify({
        title: title.value, body: body.value,
        area_id: area.value ? +area.value : null})});
      close();
      S.tab = 'threads'; S.filterState = null; S.filterArea = null;
      S.query = ''; $('.search').value = '';
      await refresh();
      if (res && res.thread) select(res.thread.id, 'thread');
    };
    const cancel = el('button', 'btn', 'Cancel');
    cancel.onclick = close;
    btns.append(save, cancel);
    box.appendChild(btns);
    title.focus();
  });
}

async function linkPicker(clueId) {
  if (!S.canEdit) return alertOnce();
  const data = await api('threads');
  const all = data ? data.threads : [];
  modal('Link to a thread', (box, close) => {
    if (!all.length) {
      box.appendChild(el('div', 'empty', 'No threads yet — press N to open one.'));
      return;
    }
    all.forEach(t => {
      const row = el('div', 'row');
      row.style.cursor = 'pointer';
      row.appendChild(el('span', 'pill ' + t.state, t.state));
      row.appendChild(document.createTextNode(t.title));
      row.onclick = async () => {
        const res = await api('link', {method: 'POST',
          body: JSON.stringify({clue_id: clueId, thread_id: t.id})});
        if (res) { close(); refresh(); }
      };
      box.appendChild(row);
    });
  });
}

function renderThreadDetail(d) {
  const t = S.detail;
  if (!t || t.id !== S.selected) { d.appendChild(el('div', 'empty', 'Loading…')); return; }
  const editable = S.canEdit;

  const title = el('input', 'fld titlefld');
  title.value = t.title;
  title.disabled = !editable;
  d.appendChild(title);

  const where = el('div', 'where');
  where.appendChild(el('span', 'pill ' + t.state, t.state));
  d.appendChild(where);

  d.appendChild(el('label', null, 'Area'));
  const area = el('select', 'fld');
  const blankArea = area.appendChild(el('option', null, '— area —'));
  blankArea.value = '';
  S.areas.forEach(a => {
    const o = el('option', null, a.name); o.value = a.id;
    if (t.area_id === a.id) o.selected = true;
    area.appendChild(o);
  });
  area.disabled = !editable;
  d.appendChild(area);

  d.appendChild(el('label', null, 'Notes'));
  const body = el('textarea', 'fld');
  body.value = t.body || '';
  body.placeholder = 'What you have tried, what you suspect you need';
  body.disabled = !editable;
  d.appendChild(body);

  if (t.state === 'solved' && t.solution) {
    d.appendChild(el('label', null, 'Solution'));
    d.appendChild(el('div', 'quote', t.solution));
  }

  // The reason this page exists: every linked clue at full length, so the
  // scattered text that feeds one puzzle is on one screen.
  d.appendChild(el('label', null, t.clues.length
    ? 'Clues feeding this (' + t.clues.length + ')'
    : 'No clues linked yet'));
  t.clues.forEach(c => {
    const wrap = el('div');
    wrap.style.marginBottom = '14px';
    const head = el('div');
    head.appendChild(el('span', 'pill ' + c.state, c.state));
    const name = el('b', null, c.title);
    name.style.cursor = 'pointer';
    name.onclick = () => { S.tab = 'clues'; S.filterState = null; S.filterArea = null;
      S.query = ''; $('.search').value = ''; refresh().then(() => select(c.id, 'clue')); };
    head.appendChild(name);
    const from = el('small', null, '  ' + [c.area, c.room].filter(Boolean).join(' '));
    from.style.color = 'var(--dim)';
    head.appendChild(from);
    wrap.appendChild(head);
    if (c.body) wrap.appendChild(el('div', 'quote', c.body));
    if (c.interpretation) {
      const i = el('div', null, c.interpretation);
      i.style.color = 'var(--dim)';
      i.style.fontSize = '13px';
      wrap.appendChild(i);
    }
    if (editable) {
      const unlink = el('button', 'btn', 'Unlink');
      unlink.style.marginTop = '6px';
      unlink.onclick = async () => {
        const res = await api('link', {method: 'DELETE',
          body: JSON.stringify({clue_id: c.id, thread_id: t.id})});
        if (res) select(t.id, 'thread');
      };
      wrap.appendChild(unlink);
    }
    d.appendChild(wrap);
  });

  if (!editable) return;

  const btns = el('div', 'btns');
  const save = el('button', 'btn go', 'Save');
  save.onclick = async () => {
    const res = await api('threads/' + t.id, {method: 'PATCH', body: JSON.stringify({
      title: title.value, area_id: area.value ? +area.value : null, body: body.value})});
    if (res) { await select(t.id, 'thread'); refresh(); }
  };
  btns.appendChild(save);

  if (t.state === 'open') {
    const solve = el('button', 'btn', 'Solve it');
    solve.onclick = () => solveDialog(t);
    btns.appendChild(solve);
  } else {
    const reopen = el('button', 'btn', 'Reopen');
    reopen.onclick = async () => {
      const res = await api('threads/' + t.id, {method: 'PATCH',
        body: JSON.stringify({state: 'open'})});
      if (res) { await select(t.id, 'thread'); refresh(); }
    };
    btns.appendChild(reopen);
  }

  const del = el('button', 'btn danger', 'Delete');
  del.onclick = async () => {
    const res = await api('threads/' + t.id, {method: 'DELETE'});
    if (res) { S.selected = null; S.detail = null; refresh(); }
  };
  btns.appendChild(del);
  d.appendChild(btns);
}

function solveDialog(t) {
  if (!S.canEdit) return alertOnce();
  modal('Solve: ' + t.title, (box, close) => {
    const sol = el('textarea', 'fld');
    // Prefilled with whatever solution the thread already carries, rather
    // than starting blank: the solve route treats an explicit "" the same
    // as any other explicit value and overwrites, so leaving this field as
    // it loaded -- not empty -- is what makes "click Solve without retyping"
    // actually preserve an existing solution instead of blanking it.
    sol.value = t.solution || '';
    sol.placeholder = 'What the answer turned out to be';
    box.appendChild(sol);

    const wrap = el('label');
    wrap.style.textTransform = 'none';
    wrap.style.letterSpacing = '0';
    wrap.style.fontSize = '13px';
    wrap.style.color = 'var(--txt)';
    const mark = el('input');
    mark.type = 'checkbox';
    mark.checked = true;
    wrap.appendChild(mark);
    wrap.appendChild(document.createTextNode(
      ' Mark the ' + t.clues.length + ' linked clue(s) as used'));
    box.appendChild(wrap);

    const btns = el('div', 'btns');
    const go = el('button', 'btn go', 'Solved');
    go.onclick = async () => {
      const res = await api('threads/' + t.id + '/solve', {method: 'POST',
        body: JSON.stringify({solution: sol.value, mark_clues_used: mark.checked})});
      if (!res) return;
      close(); await select(t.id, 'thread'); refresh();
    };
    const cancel = el('button', 'btn', 'Cancel');
    cancel.onclick = close;
    btns.append(go, cancel);
    box.appendChild(btns);
  });
}

function renderProgress(d) {
  const editable = S.canEdit;
  S.checklist.forEach(group => {
    const done = group.items.filter(i => i.done).length;
    const h = el('label', null, group.group + ' — ' + done + '/' + group.items.length);
    d.appendChild(h);
    group.items.forEach(item => {
      // Class, not inline styles: the phone layout stacks the note under the
      // name, and a media query cannot override a style attribute.
      const row = el('div', 'row prow');
      const box = el('input');
      box.type = 'checkbox';
      box.checked = item.done;
      box.disabled = !editable;
      box.onchange = async () => {
        const res = await api('checklist/' + item.id, {method: 'PATCH',
          body: JSON.stringify({done: box.checked})});
        if (res) refresh(); else box.checked = item.done;
      };
      const name = el('span', null, item.name);
      if (item.done) name.style.color = 'var(--dim)';
      const note = el('input', 'fld pnote');
      note.value = item.note || '';
      note.placeholder = 'note';
      note.disabled = !editable;
      note.onchange = async () => {
        const res = await api('checklist/' + item.id, {method: 'PATCH',
          body: JSON.stringify({note: note.value})});
        if (!res) note.value = item.note || '';
      };
      row.append(box, name);
      // On a phone the note is a full-width second line, and 70 always-visible
      // empty boxes turn ticking off a checklist into a very long scroll. An
      // empty note collapses to a small tap target until it's wanted; one that
      // already has text stays visible, because that text is the point.
      if (isNarrow() && !item.note && editable) {
        const addNote = el('button', 'btn notebtn', 'note');
        addNote.onclick = () => { addNote.replaceWith(note); note.focus(); };
        row.appendChild(addNote);
      } else if (isNarrow() && !item.note && !editable) {
        // nothing to show a reader: no note, and no way to add one
      } else {
        row.appendChild(note);
      }
      if (editable) {
        const del = el('button', 'btn danger pdel', '×');
        del.title = 'Remove this row';
        del.onclick = async () => {
          const res = await api('checklist/' + item.id, {method: 'DELETE'});
          if (res) refresh();
        };
        row.appendChild(del);
      }
      d.appendChild(row);
    });

    if (editable) {
      const add = el('button', 'btn', '+ add a row');
      add.style.margin = '8px 0 4px';
      add.onclick = () => {
        const name = prompt('Add to ' + group.group + ':');
        if (!name) return;
        // A duplicate name comes back as a 409 with {"error": "already on
        // the list"} -- api() already turns that into a toast, so the only
        // job left here is to not refresh (and not pretend it worked) when
        // it fails.
        api('checklist', {method: 'POST',
          body: JSON.stringify({group: group.group, name})})
          .then(res => { if (res) refresh(); });
      };
      d.appendChild(add);
    }
  });
}

// ---------------------------------------------------------------------------
// Header and keyboard
// ---------------------------------------------------------------------------
document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => setTab(b.dataset.tab);
});

function setTab(tab) {
  S.tab = tab;
  S.selected = null;
  S.selectedKind = null;
  S.detail = null;
  S.filterState = null;
  S.filterSource = null;
  // Switching tabs on a phone always lands on that tab's list, never on a
  // stale detail or filter screen belonging to the tab you just left.
  S.pane = 'list';
  refresh();
}

// A phone rotated into landscape, or a desktop window dragged narrow, moves
// between the two layouts. Re-render so the panes and the mobile-only chrome
// match whichever one is now in force.
NARROW.addEventListener('change', () => { S.pane = 'list'; render(); });

let searchTimer = null;
$('.search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    S.query = e.target.value.trim();
    S.selected = null;
    // Typing or clearing a query replaces what the list holds, so a phone
    // sitting on a detail screen would otherwise be left showing a result
    // that is no longer in the list behind it.
    S.pane = 'list';
    refresh();
  }, 180);
});

function typing() {
  const t = document.activeElement && document.activeElement.tagName;
  return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const m = document.querySelector('.modal');
    if (m) { m.remove(); return; }
    if (document.activeElement === $('.search')) {
      $('.search').value = ''; S.query = ''; $('.search').blur(); refresh();
    }
    return;
  }
  if (typing() || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.querySelector('.modal')) return;

  // Shares its ordering with renderList() via visibleRows(), so j/k always
  // moves through exactly what's on screen -- the tab's own list normally,
  // both kinds together during a live search.
  const rows = visibleRows();
  const at = rows.findIndex(r => r.id === S.selected && r.kind === S.selectedKind);

  switch (e.key) {
    case '/': e.preventDefault(); $('.search').focus(); break;
    // n/N/l are write shortcuts with no visible button backing them (quick
    // capture and the link picker are keyboard-only); the footer that lists
    // them is hidden for a read-only session (see boot()), so the keys stay
    // just as invisible and do nothing rather than popping a modal that can
    // only ever refuse to save.
    case 'n': if (S.canEdit) { e.preventDefault(); newClue(); } break;
    case 'N': if (S.canEdit) { e.preventDefault(); newThread(); } break;
    case '1': setTab('clues'); break;
    case '2': setTab('threads'); break;
    case '3': setTab('progress'); break;
    case 'j': if (rows.length) { const r = rows[Math.min(at + 1, rows.length - 1)];
      select(r.id, r.kind); } break;
    case 'k': if (rows.length) { const r = rows[Math.max(at - 1, 0)];
      select(r.id, r.kind); } break;
    case 'l':
      if (S.canEdit && S.selectedKind === 'clue' && S.selected) {
        e.preventDefault(); linkPicker(S.selected);
      }
      break;
  }
});

boot();
</script>
